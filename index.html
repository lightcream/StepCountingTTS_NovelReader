<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页手机步数计数器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .counter-box {
            font-size: 64px;
            font-weight: bold;
            color: #3498db;
            margin: 20px 0;
        }
        .label {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        #startBtn {
            background-color: #2ecc71;
            color: white;
        }
        #startBtn:hover {
            background-color: #27ae60;
        }
        #resetBtn {
            background-color: #e74c3c;
            color: white;
        }
        #resetBtn:hover {
            background-color: #c0392b;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 网页步数计数器</h1>
    <div class="counter-box" id="stepCount">0</div>
    <div class="label">当前实时步数</div>
    
    <div class="btn-group">
        <button id="startBtn" onclick="toggleTracking()">开始统计</button>
        <button id="resetBtn" onclick="resetSteps()">重置</button>
    </div>
    
    <div class="status" id="status">点击“开始统计”并允许获取传感器权限</div>
</div>

<script>
    let steps = 0;
    let isTracking = false;
    let lastMagnitude = 0;
    let lastTime = 0;
    
    // 计步核心参数：阈值与防抖时间
    const THRESHOLD = 1.2; 
    const MIN_TIME_DIFF = 250; 

    function updateDisplay() {
        document.getElementById('stepCount').innerText = steps;
    }

    function toggleTracking() {
        if (!isTracking) {
            // 兼容 iOS 13+ 设备的传感器权限请求
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startMotionListener();
                        } else {
                            document.getElementById('status').innerText = '权限被拒绝，无法获取运动数据';
                        }
                    })
                    .catch(console.error);
            } else {
                // 安卓及其他标准浏览器
                startMotionListener();
            }
        } else {
            stopMotionListener();
        }
    }

    function startMotionListener() {
        window.addEventListener('devicemotion', handleMotion, true);
        isTracking = true;
        document.getElementById('startBtn').innerText = '停止统计';
        document.getElementById('startBtn').style.backgroundColor = '#e67e22';
        document.getElementById('status').innerText = '正在实时检测步伐...';
    }

    function stopMotionListener() {
        window.removeEventListener('devicemotion', handleMotion, true);
        isTracking = false;
        document.getElementById('startBtn').innerText = '开始统计';
        document.getElementById('startBtn').style.backgroundColor = '#2ecc71';
        document.getElementById('status').innerText = '已暂停';
    }

    function handleMotion(event) {
        const acc = event.accelerationIncludingGravity;
        if (!acc) return;

        // 计算三轴合加速度
        const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        const currentTime = new Date().getTime();

        // 简易峰值与防抖判断
        if (Math.abs(magnitude - lastMagnitude) > THRESHOLD) {
            if (currentTime - lastTime > MIN_TIME_DIFF) {
                steps++;
                updateDisplay();
                lastTime = currentTime;
            }
        }
        lastMagnitude = magnitude;
    }

    function resetSteps() {
        steps = 0;
        updateDisplay();
        document.getElementById('status').innerText = '步数已清零';
    }
</script>

</body>
</html>
