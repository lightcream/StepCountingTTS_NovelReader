<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#35393e">
<title>步读 · 边走边读</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%2339c5bb'/><rect x='20' y='18' width='24' height='30' rx='3' fill='none' stroke='%23062a27' stroke-width='4'/><path d='M32 18v30' stroke='%23062a27' stroke-width='4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&family=Noto+Serif+SC&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Long+Cang&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#35393e;          /* 灰底 */
  --mod:#2c2f34;         /* 暗黑模块 */
  --ink:#e6e9ec; --ink2:#a4abb2; --ink3:#7b828a;
  --green:#39c5bb; --green-hi:#4bd8ce; --green-ink:#062a27;
  --sh-d:rgba(15,17,20,.55); --sh-l:rgba(255,255,255,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
input{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit}

/* ---------- 句子舞台 ---------- */
#stage{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}
#emptyHint{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);
  color:var(--ink3);font-size:13px;letter-spacing:.3em;white-space:nowrap;z-index:1}
body.has-book #emptyHint{display:none}

.sentence{position:absolute;z-index:2;line-height:1.4;font-weight:500;letter-spacing:.02em;
  opacity:0;transition:opacity .45s ease;text-shadow:0 2px 12px rgba(10,12,14,.45)}
.sentence.on{opacity:1}
.sentence.out{opacity:0;transition:opacity .3s ease}
.ch{display:inline-block;transform:rotate(var(--r,0deg));
  animation:chIn .55s cubic-bezier(.18,.9,.28,1.35) both}
@keyframes chIn{
  from{opacity:0;transform:translateY(.45em) scale(.1) rotate(var(--r,0deg))}
  to{opacity:1;transform:translateY(0) scale(1) rotate(var(--r,0deg))}}

/* ---------- 顶部状态胶囊 ---------- */
#statusPill{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:99px;
  background:var(--mod);box-shadow:5px 6px 14px var(--sh-d),-4px -4px 10px var(--sh-l);
  font-size:12px;color:var(--ink2);white-space:nowrap;max-width:94vw;overflow:hidden}
#statusPill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
#statusPill .brand{color:var(--ink);font-weight:700;letter-spacing:.14em}
#statusPill .sep{width:1px;height:12px;background:rgba(255,255,255,.1);flex:none}
#stCue{color:var(--green);overflow:hidden;text-overflow:ellipsis}

/* ---------- Toast ---------- */
#toasts{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--mod);color:var(--ink);padding:10px 18px;border-radius:13px;font-size:13px;
  box-shadow:6px 8px 18px var(--sh-d),-4px -4px 10px var(--sh-l);
  opacity:0;transform:translateY(-8px);transition:.3s;max-width:92vw}
.toast.on{opacity:1;transform:none}

/* ---------- 面板 ---------- */
#panelWrap{position:fixed;left:0;right:0;bottom:0;z-index:50;
  transition:transform .42s cubic-bezier(.32,.72,.28,1)}
#panelWrap.closed{transform:translateY(calc(100% + 20px));pointer-events:none}
#panel{max-height:70vh;overflow-y:auto;overscroll-behavior:contain;
  padding:2px 16px calc(16px + env(safe-area-inset-bottom))}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:rgba(0,0,0,.35);border-radius:99px}

.p-head{display:flex;align-items:center;gap:14px;padding:14px 2px 12px;max-width:1280px;margin:0 auto}
.p-lab{font-size:11px;letter-spacing:.3em;color:var(--ink3);font-weight:600;flex:none}
#mainProg{flex:1;min-width:100px}
.p-num{font:600 12px/1 ui-monospace,'SF Mono',Consolas,monospace;color:var(--green);
  flex:none;min-width:74px;text-align:right}

.p-grid{display:grid;gap:14px;max-width:1280px;margin:0 auto;
  grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
@media(min-width:1230px){.p-grid{grid-template-columns:repeat(8,1fr)}}

.mod{background:var(--mod);border-radius:20px;padding:16px 15px 13px;
  box-shadow:8px 9px 18px var(--sh-d),-7px -7px 14px var(--sh-l);
  display:flex;flex-direction:column;gap:11px;min-width:0;min-height:0}
.mod h3{font-size:11px;font-weight:600;letter-spacing:.3em;color:var(--ink3);
  display:flex;align-items:center;gap:8px}
.mod h3 i{width:5px;height:5px;border-radius:50%;background:var(--green);opacity:.85;flex:none}
.mod h3::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.65;margin-top:auto}

.meta{font-size:12px;color:var(--ink3);line-height:1.6;word-break:break-all}
.meta .bname{color:var(--ink2);font-weight:600;display:block}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;
  border-radius:13px;padding:10px 12px;font-size:13px;font-weight:600;width:100%;
  background:var(--green);color:var(--green-ink);
  box-shadow:5px 5px 12px var(--sh-d),-4px -4px 10px var(--sh-l);
  transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(1px);
  box-shadow:inset 4px 4px 8px rgba(8,42,38,.5),inset -3px -3px 6px rgba(255,255,255,.28)}
.btn.sm{padding:8px 10px;font-size:12px;border-radius:11px}
.btn.ghost{background:var(--mod);color:var(--ink2);
  box-shadow:inset 4px 4px 8px rgba(12,14,16,.5),inset -3px -3px 6px rgba(255,255,255,.045)}
.btn.ghost:active{color:var(--green)}
.btn.live{animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{box-shadow:5px 5px 12px var(--sh-d),-4px -4px 10px var(--sh-l),0 0 0 5px rgba(57,197,187,.15)}}

.icon-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;flex:none;
  background:var(--mod);color:var(--ink2);display:grid;place-items:center;
  box-shadow:4px 4px 9px var(--sh-d),-3px -3px 8px var(--sh-l);transition:.15s}
.icon-btn:active{color:var(--green);
  box-shadow:inset 3px 3px 6px rgba(12,14,16,.5),inset -2px -2px 5px rgba(255,255,255,.05)}

.brow{display:flex;gap:8px}
.bcol{display:flex;flex-direction:column;gap:8px}
.steprow{display:flex;align-items:baseline;gap:7px;color:var(--ink3);font-size:12px}
.steprow b{font:700 25px/1 ui-monospace,'SF Mono',Consolas,monospace;color:var(--green)}

/* ---------- 分段选择 ---------- */
.seg{display:flex;gap:9px}
.seg-btn{flex:1;padding:9px 4px;border-radius:12px;border:none;cursor:pointer;
  background:var(--mod);color:var(--ink2);font:600 13px/1 inherit;
  box-shadow:inset 4px 4px 8px rgba(12,14,16,.55),inset -3px -3px 6px rgba(255,255,255,.045);
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.18s;min-width:0}
.seg-btn.sel{background:var(--green);color:var(--green-ink);
  box-shadow:4px 4px 10px var(--sh-d),-3px -3px 8px var(--sh-l),inset 0 0 0 1px rgba(255,255,255,.16)}
.seg-btn.locked{opacity:.42;cursor:not-allowed}
.seg-btn .lk{display:none;line-height:0}
.seg-btn.locked .lk{display:inline-flex}
.seg-btn.deny{animation:deny .32s}
@keyframes deny{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- 参数行 ---------- */
.prm{display:flex;flex-direction:column;gap:3px;min-width:0}
.prm-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.prm-top label{font-size:12px;color:var(--ink2)}
.pnum{width:64px;background:#26292d;border:none;border-radius:9px;padding:5px 7px;color:var(--green);
  font:600 12px/1.2 ui-monospace,'SF Mono',Consolas,monospace;text-align:right;
  box-shadow:inset 3px 3px 6px rgba(12,14,16,.6),inset -2px -2px 4px rgba(255,255,255,.04)}
.pnum:focus{outline:none;box-shadow:inset 3px 3px 6px rgba(12,14,16,.6),0 0 0 1.5px rgba(57,197,187,.65)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

/* ---------- 滑块 ---------- */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,rgba(57,197,187,.92) var(--p,0%),#24272b var(--p,0%));
  box-shadow:inset 3px 3px 6px rgba(12,14,16,.65),inset -2px -2px 4px rgba(255,255,255,.05)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-4px;border-radius:50%;
  background:var(--green);
  box-shadow:2px 2px 6px rgba(12,14,16,.6),-1px -1px 3px rgba(255,255,255,.3),inset 0 0 0 2px rgba(255,255,255,.14)}
.rng::-moz-range-track{height:8px;border-radius:99px;background:#24272b;
  box-shadow:inset 3px 3px 6px rgba(12,14,16,.65),inset -2px -2px 4px rgba(255,255,255,.05)}
.rng::-moz-range-progress{height:8px;border-radius:99px;background:rgba(57,197,187,.92)}
.rng::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--green);
  box-shadow:2px 2px 6px rgba(12,14,16,.6)}

/* ---------- 底部浮动展开钮 ---------- */
#floatToggle{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:var(--green);color:var(--green-ink);display:grid;place-items:center;
  box-shadow:0 12px 26px rgba(0,0,0,.5),0 3px 8px rgba(57,197,187,.3);
  transform:translateX(-50%) translateY(70px);opacity:0;pointer-events:none;transition:.38s}
body.panel-closed #floatToggle{transform:translateX(-50%);opacity:1;pointer-events:auto}

/* ---------- 底部细线进度条 ---------- */
#thinWrap{position:fixed;left:0;right:0;bottom:0;height:24px;z-index:80;display:none;cursor:pointer}
body.panel-closed #thinWrap,body.fs #thinWrap{display:block}
#thinRange{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;
  cursor:pointer;position:absolute;inset:0;margin:0}
#thinRange::-webkit-slider-runnable-track{height:4px;border-radius:99px;
  background:linear-gradient(90deg,var(--green) var(--p,0%),rgba(0,0,0,.35) var(--p,0%));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
#thinRange::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:14px;margin-top:-5px;
  border-radius:3px;background:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.5)}
#thinRange::-moz-range-track{height:4px;border-radius:99px;background:rgba(0,0,0,.35)}
#thinRange::-moz-range-progress{height:4px;border-radius:99px;background:var(--green)}
#thinRange::-moz-range-thumb{width:7px;height:14px;border:none;border-radius:3px;background:var(--green)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="emptyHint">上 传 一 本 书 · 选 择 播 放 模 式 · 走 起 来</div>

<header id="statusPill">
  <span class="dot"></span><span class="brand">步读</span>
  <span class="sep"></span><span id="stMode">未选模式</span>
  <span class="sep"></span><span id="stSent">0/0</span>
  <span class="sep"></span><span id="stSteps">0 步</span>
  <span id="stCue"></span>
</header>

<div id="toasts"></div>

<div id="panelWrap"><div id="panel">
  <div class="p-head">
    <span class="p-lab">阅读进度</span>
    <input id="mainProg" class="rng" type="range" min="0" max="1000" step="1" value="0">
    <span class="p-num" id="progText">0 / 0</span>
    <button id="btnCollapse" class="icon-btn" title="收起面板"></button>
  </div>
  <div class="p-grid">

    <section class="mod">
      <h3><i></i>书 籍</h3>
      <button class="btn" id="btnUpload"><span class="ic"></span><span>选择书籍</span></button>
      <input type="file" id="fileInput" accept=".txt,.epub" hidden>
      <div class="meta"><span class="bname" id="bookName">未选择</span><span id="bookStat">支持 TXT / EPUB，随时可更换</span></div>
    </section>

    <section class="mod">
      <h3><i></i>文本分析</h3>
      <div class="seg" id="segAnalyse">
        <button class="seg-btn" data-am="novel">小说</button>
        <button class="seg-btn" data-am="script">剧本</button>
      </div>
      <p class="hint">句号断句、引号成对携带；剧本模式只念台词、不念人物名</p>
    </section>

    <section class="mod">
      <h3><i></i>播放模式</h3>
      <div class="seg">
        <button class="seg-btn" data-pm="A">累积<span class="lk"></span></button>
        <button class="seg-btn" data-pm="B">触发<span class="lk"></span></button>
      </div>
      <p class="hint" id="modeHint">选定后本次会话锁定，刷新页面可重选</p>
    </section>

    <section class="mod">
      <h3><i></i>步数参数</h3>
      <div id="prmPlay"></div>
      <p class="hint">累积：每 N 步解锁一句；触发：步数上涨即连读 N 句</p>
    </section>

    <section class="mod">
      <h3><i></i>字号范围</h3>
      <div id="prmFont"></div>
      <p class="hint">每句在最小 ~ 最大字号间随机取值</p>
    </section>

    <section class="mod">
      <h3><i></i>语音</h3>
      <div id="prmVoice"></div>
      <p class="hint">调用系统默认 TTS，参数自下一句起生效</p>
    </section>

    <section class="mod">
      <h3><i></i>计步器</h3>
      <div class="steprow"><b id="stepNum">0</b><span>步（本次会话）</span></div>
      <div class="brow">
        <button class="btn sm" id="btnPed"><span class="ic"></span><span id="btnPedTxt">启动计步</span></button>
        <button class="btn sm ghost" id="btnSim">模拟一步</button>
      </div>
      <div id="prmPede"></div>
    </section>

    <section class="mod">
      <h3><i></i>控制</h3>
      <div class="bcol">
        <button class="btn sm" id="btnSpeak"><span class="ic"></span><span>朗读当前句</span></button>
        <button class="btn sm ghost" id="btnFs"><span class="ic"></span><span id="btnFsTxt">进入全屏</span></button>
      </div>
    </section>

  </div>
</div></div>

<button id="floatToggle" title="展开设置面板"></button>
<div id="thinWrap"><input id="thinRange" type="range" min="0" max="1000" step="1" value="0"></div>

<script>
'use strict';
/* ============ 工具 ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const stage=$('#stage');

/* 内联 SVG 图标（不依赖外部图标库） */
const SV=(p)=>`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
  up:SV('<path d="M12 15V4m0 0-5 5m5-5 5 5M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>'),
  lock:SV('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>'),
  play:SV('<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>'),
  exp:SV('<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>'),
  comp:SV('<path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/>'),
  chevU:SV('<path d="M6 14l6-6 6 6"/>'),
  chevD:SV('<path d="M6 10l6 6 6-6"/>')
};

/* ============ Toast ============ */
function toast(msg,ms=2800){
  const box=$('#toasts'),el=document.createElement('div');
  el.className='toast';el.textContent=msg;box.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('on'));
  setTimeout(()=>{el.classList.remove('on');setTimeout(()=>el.remove(),320)},ms);
}

/* ============ 参数系统（滑块 + 输入框，两位小数，localStorage 持久化） ============ */
const DEFAULTS={stepThreshold:20,triggerCount:1,fontMin:26,fontMax:72,
  rate:1,pitch:1,volume:1,sensitivity:1,analysisMode:'novel'};
let P;
try{P={...DEFAULTS,...JSON.parse(localStorage.getItem('sr_params')||'{}')}}catch{P={...DEFAULTS}}
let saveT=null;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{
  try{localStorage.setItem('sr_params',JSON.stringify(P))}catch{}},250)}

function setFill(r){const p=(+r.value-+r.min)/(+r.max-+r.min)*100;r.style.setProperty('--p',p+'%')}

function buildParam(host,key,label,min,max,hook){
  const row=document.createElement('div');row.className='prm';
  row.innerHTML=`<div class="prm-top"><label>${label}</label>
    <input type="number" class="pnum" inputmode="decimal" step="0.01" min="${min}" max="${max}"></div>
    <input type="range" class="rng" min="${min}" max="${max}" step="0.01">`;
  const rng=row.querySelector('.rng'),num=row.querySelector('.pnum');
  const set=v=>{
    v=clamp(Math.round((+v)*100)/100,min,max);
    if(isNaN(v))v=DEFAULTS[key];
    P[key]=v;rng.value=v;num.value=v.toFixed(2);setFill(rng);
    if(hook)hook(v);saveSoon();
  };
  rng.addEventListener('input',()=>set(rng.value));
  num.addEventListener('change',()=>set(num.value));
  host.appendChild(row);
  set(P[key]??DEFAULTS[key]);
  return set;
}
const setFMin=buildParam($('#prmFont'),'fontMin','最小字号',12,150,v=>{if(v>P.fontMax)setFMax(v)});
const setFMax=buildParam($('#prmFont'),'fontMax','最大字号',14,200,v=>{if(v<P.fontMin)setFMin(v)});
buildParam($('#prmPlay'),'stepThreshold','累积步数 / 句',1,200);
buildParam($('#prmPlay'),'triggerCount','触发句数',1,30);
buildParam($('#prmVoice'),'rate','语速',0.5,2);
buildParam($('#prmVoice'),'pitch','音调',0.5,1.5);
buildParam($('#prmVoice'),'volume','音量',0,1);
buildParam($('#prmPede'),'sensitivity','步伐灵敏度',0.3,2.5);

/* ============ 全局状态 ============ */
const S={sentences:[],idx:0,mode:null,steps:0};
const Eng={speaking:false,cancelFlag:false,credits:0,pending:0,remainB:0,armed:true};
let Book=null,curSent=null,speakTimer=null,liveU=null,voice=null,doneTold=false,warnedNoMode=false;

const FONTS=["'Noto Sans SC',sans-serif","'Noto Serif SC',serif","'ZCOOL KuaiLe',cursive",
  "'ZCOOL XiaoWei',serif","'Ma Shan Zheng',cursive","'Long Cang',cursive","'Liu Jian Mao Cao',cursive"];

/* ============ 文本分析 ============ */
const OPEN_Q=new Set(['\u201C','\u2018','\u300C','\u300E']);
const CLOSE_Q=new Set(['\u201D','\u2019','\u300D','\u300F']);

/* 小说模式：句号/问号/叹号断句；引号深度保证成对携带，绝不把对话拆碎 */
function splitNovel(text){
  const out=[];let cur='',depth=0,dq=0,sq=0;
  const feed=ch=>{
    if(OPEN_Q.has(ch)){depth++;return 'open'}
    if(CLOSE_Q.has(ch)){depth--;return 'close'}
    if(ch==='"'){if(dq%2===0){dq++;depth++;return 'open'}dq--;depth--;return 'close'}
    if(ch==="'"){if(sq%2===0){sq++;depth++;return 'open'}sq--;depth--;return 'close'}
    return null;
  };
  const peek=ch=>{
    if(OPEN_Q.has(ch))return 'open';
    if(CLOSE_Q.has(ch))return 'close';
    if(ch==='"')return dq%2===1?'close':'open';
    if(ch==="'")return sq%2===1?'close':'open';
    return null;
  };
  const push=()=>{const s=cur.trim();if(s)out.push(s);cur='';depth=0};
  let i=0;const n=text.length;
  while(i<n){
    const ch=text[i];cur+=ch;feed(ch);i++;
    if(ch==='。'||ch==='！'||ch==='？'||ch==='．'){
      while(i<n&&peek(text[i])==='close'){cur+=text[i];feed(text[i]);i++} // 吸收紧随其后的闭引号
      if(depth<=0)push();          // 引号已平衡 → 完整一句
      /* depth>0：句号在未闭合的引号内，句子继续延伸，避免引号裂开 */
    }else if(ch==='\n'&&depth<=0){push()}
  }
  push();
  return out;
}

/* 剧本模式：人物：「台词」——整段台词为一句，只念引号内内容；其余行按小说规则 */
function splitScript(text){
  const out=[];
  for(const line of text.split(/\r?\n/)){
    const t=line.trim();if(!t)continue;
    const m=t.match(/^([^\s：:"'「」]{1,12})\s*[：:]\s*[「"'](.+)[」"']\s*$/);
    if(m)out.push(m[2]); // 贪婪匹配到最后一个闭引号，嵌套名词引号不会被截断
    else out.push(...splitNovel(t));
  }
  return out;
}

function cleanSpeak(s){return s.replace(/["“”‘’「」『』]/g,'').replace(/\s+/g,' ').trim()}

function analyze(){
  S.sentences=[];
  if(!Book||!Book.text)return;
  const raw=P.analysisMode==='script'?splitScript(Book.text):splitNovel(Book.text);
  S.sentences=raw.map(t=>({text:t.trim(),speak:cleanSpeak(t)}))
    .filter(s=>s.speak&&s.text);
}

/* ============ 书籍加载 ============ */
function decodeTxt(buf){
  if(buf[0]===0xEF&&buf[1]===0xBB&&buf[2]===0xBF)return new TextDecoder('utf-8').decode(buf);
  for(const enc of['utf-8','gbk','big5']){
    try{return new TextDecoder(enc,{fatal:true}).decode(buf)}catch{}
  }
  return new TextDecoder('utf-8').decode(buf);
}
function resolvePath(base,rel){
  const out=[];
  for(const seg of(base+rel).split('/')){
    if(!seg||seg==='.')continue;
    if(seg==='..')out.pop();else out.push(seg);
  }
  return out.join('/');
}
function zipFind(zip,path){
  let f=zip.file(path);
  if(f)return f;
  try{f=zip.file(decodeURIComponent(path))}catch{}
  if(f)return f;
  const name=path.split('/').pop();
  const hit=Object.keys(zip.files).find(k=>k===name||k.endsWith('/'+name));
  return hit?zip.file(hit):null;
}
function extractText(root){
  const BLOCK=new Set(['P','DIV','H1','H2','H3','H4','H5','H6','LI','BLOCKQUOTE',
    'SECTION','ARTICLE','BR','TR','FIGURE','UL','OL','TABLE','ASIDE','NAV']);
  let out='';
  (function walk(n){
    if(n.nodeType===3){out+=n.data;return}
    if(n.nodeType!==1)return;
    const tag=n.tagName;
    if(/^(SCRIPT|STYLE|HEAD|TITLE)$/.test(tag))return;
    if(tag==='BR'){out+='\n';return}
    n.childNodes.forEach(walk);
    if(BLOCK.has(tag))out+='\n';
  })(root);
  return out;
}
async function parseEpub(buf){
  if(typeof JSZip==='undefined')throw new Error('nozip');
  const zip=await JSZip.loadAsync(buf);
  const cont=zipFind(zip,'META-INF/container.xml');
  if(!cont)throw new Error('bad');
  const cxml=await cont.async('string');
  const m=cxml.match(/full-path\s*=\s*"([^"]+)"/);
  if(!m)throw new Error('bad');
  const opfPath=m[1],dir=opfPath.includes('/')?opfPath.replace(/[^/]*$/,''):'';
  const opfFile=zipFind(zip,opfPath);
  if(!opfFile)throw new Error('bad');
  const doc=new DOMParser().parseFromString(await opfFile.async('string'),'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('bad');
  const map={};
  doc.querySelectorAll('manifest item').forEach(it=>map[it.getAttribute('id')]=it.getAttribute('href'));
  const refs=[...doc.querySelectorAll('spine itemref')].map(r=>map[r.getAttribute('idref')]).filter(Boolean);
  let text='';
  for(const href of refs){
    const f=zipFind(zip,dir?resolvePath(dir,href):href);
    if(!f)continue;
    const h=new DOMParser().parseFromString(await f.async('string'),'text/html');
    if(h.body)text+=extractText(h.body)+'\n';
  }
  return text.replace(/\n{3,}/g,'\n\n');
}

 $('#btnUpload').addEventListener('click',()=>$('#fileInput').click());
 $('#fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  toast('正在解析书籍…');
  try{
    let text;
    if(/\.epub$/i.test(f.name))text=await parseEpub(await f.arrayBuffer());
    else text=decodeTxt(await f.arrayBuffer());
    if(!text||!text.trim())throw new Error('empty');
    Book={name:f.name.replace(/\.(txt|epub)$/i,''),text};
    try{localStorage.setItem('sr_book',JSON.stringify(Book))}
    catch{toast('书籍较大，本次会话内可用，未能长期保存')}
    stopSpeaking();
    S.idx=0;S.steps=0;doneTold=false;
    Eng.credits=0;Eng.pending=0;Eng.remainB=0;Eng.armed=true;
    analyze();updateAll();
    toast(`已加载《${Book.name}》，共 ${S.sentences.length} 句`);
  }catch(err){
    toast(/\.epub$/i.test(f.name)?'EPUB 解析失败（需联网加载解析库）':'无法识别该书文本');
  }
});

/* ============ TTS（系统默认语音） ============ */
function pickVoice(){
  if(!('speechSynthesis'in window))return;
  const vs=speechSynthesis.getVoices();if(!vs.length)return;
  voice=vs.find(v=>v.default&&/zh/i.test(v.lang))
    ||vs.find(v=>/^zh[-_]?cn/i.test(v.lang))
    ||vs.find(v=>/^zh/i.test(v.lang))
    ||vs.find(v=>v.default)||null;
}
if('speechSynthesis'in window){
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged',pickVoice);
}else toast('当前浏览器不支持语音合成');

function speakText(text){
  if(!('speechSynthesis'in window)){setTimeout(endSentence,50);return}
  const u=new SpeechSynthesisUtterance(text);
  u.rate=clamp(P.rate,0.1,10);u.pitch=clamp(P.pitch,0,2);u.volume=clamp(P.volume,0,1);
  if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='zh-CN';
  liveU=u; // 保引用，防止被回收导致 onend 丢失
  let done=false;
  const fin=()=>{
    if(done)return;done=true;
    clearTimeout(speakTimer);speakTimer=null;
    if(Eng.cancelFlag){Eng.cancelFlag=false;return}
    endSentence();
  };
  u.onend=fin;u.onerror=fin;
  speechSynthesis.speak(u);
  const est=text.length/(4*Math.max(0.3,P.rate))*1000+3000;
  speakTimer=setTimeout(fin,Math.max(9000,est*2)); // 兜底：防止个别设备 onend 不回调
}

/* ============ 播放引擎 ============ */
function pump(){
  if(Eng.speaking||!S.sentences.length||S.idx>=S.sentences.length)return;
  if(S.mode==='A'){if(Eng.credits>0){Eng.credits--;go()}}
  else if(S.mode==='B'){if(Eng.remainB>0){Eng.remainB--;go()}}
}
function go(){
  if(Eng.speaking)return;
  if(S.idx>=S.sentences.length){
    if(!doneTold){doneTold=true;toast('已读完全书，可拖动进度条回看')}
    return;
  }
  Eng.speaking=true;Eng.cancelFlag=false;
  const s=S.sentences[S.idx];
  showSentence(s.text);
  updateStatus();
  setTimeout(()=>speakText(s.speak),60); // 略延迟，规避 cancel 后立即 speak 的兼容问题
}
function endSentence(){
  hideSentence(false);
  Eng.speaking=false;
  S.idx++;
  if(S.mode==='B'&&Eng.remainB<=0)Eng.armed=true; // 读完所有句数后才重新武装
  saveProgressSoon();
  updateAll();
  pump(); // 模式 A 有堆积权限 → 立即接下一句
}
function onStep(){
  S.steps++;
  $('#stepNum').textContent=S.steps;
  if(!S.mode){
    if(!warnedNoMode){warnedNoMode=true;toast('请先在下方选择一种播放模式')}
    updateStatus();return;
  }
  if(S.mode==='A'){
    const thr=Math.max(1,Math.round(P.stepThreshold));
    Eng.pending++;
    while(Eng.pending>=thr){Eng.pending-=thr;Eng.credits++} // 朗读期间的步数照常累积、堆积
  }else if(S.mode==='B'){
    if(!Eng.speaking&&Eng.armed){ // 朗读期间步数上涨不触发；读完后首次上涨才触发
      Eng.remainB=clamp(Math.round(P.triggerCount),1,999);
      Eng.armed=false;
    }
  }
  updateStatus();
  pump();
}
function stopSpeaking(){
  if(!Eng.speaking)return;
  Eng.cancelFlag=true;
  try{speechSynthesis.cancel()}catch{}
  clearTimeout(speakTimer);speakTimer=null;
  hideSentence(true);
  Eng.speaking=false;Eng.remainB=0;Eng.armed=true;
}
function jumpTo(i){
  if(!S.sentences.length)return;
  stopSpeaking();
  S.idx=clamp(Math.round(i),0,S.sentences.length-1);
  doneTold=false;
  saveProgressSoon();updateAll();
  pump(); // 若模式 A 仍有堆积句权限，跳转后立即从新位置继续
}

/* ============ 句子随机展示 ============ */
function showSentence(text){
  hideSentence(true);
  const el=document.createElement('div');el.className='sentence';
  const lo=Math.min(P.fontMin,P.fontMax),hi=Math.max(P.fontMin,P.fontMax);
  el.style.fontSize=rnd(lo,hi).toFixed(2)+'px';
  el.style.maxWidth='min(92vw,26em)';
  [...text].forEach((ch,i)=>{
    const sp=document.createElement('span');sp.className='ch';
    sp.textContent=ch===' '?'\u00A0':ch;
    sp.style.color=`hsl(${Math.round(rnd(0,360))},${Math.round(rnd(45,95))}%,${Math.round(rnd(52,80))}%)`;
    sp.style.fontFamily=FONTS[Math.floor(Math.random()*FONTS.length)];
    sp.style.fontSize=rnd(0.9,1.12).toFixed(2)+'em';
    sp.style.setProperty('--r',rnd(-6,6).toFixed(1)+'deg');
    sp.style.animationDelay=Math.min(i*26,2400)+'ms';
    el.appendChild(sp);
  });
  el.style.visibility='hidden';
  stage.appendChild(el);
  // 先测量再定位：保证完整落在视口内，绝不贴边或被裁剪
  const sideM=16,topM=64;
  const botM=document.body.classList.contains('panel-closed')?84:$('#panelWrap').offsetHeight+14;
  let w=el.offsetWidth,h=el.offsetHeight;
  const availH=Math.max(80,innerHeight-topM-botM);
  if(h>availH){const sc=availH/h;el.style.transform=`scale(${sc.toFixed(3)})`;w*=sc;h*=sc}
  const maxL=Math.max(sideM,innerWidth-sideM*2-w);
  const maxT=Math.max(topM,innerHeight-botM-h-topM);
  el.style.left=Math.round(rnd(sideM,maxL))+'px';
  el.style.top=Math.round(rnd(topM,maxT))+'px';
  el.style.visibility='';
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
  curSent=el;
}
function hideSentence(immediate){
  if(!curSent)return;
  const el=curSent;curSent=null;
  if(immediate){el.remove();return}
  el.classList.add('out');
  setTimeout(()=>el.remove(),340);
}
addEventListener('resize',()=>{ // 旋转/缩放屏幕后把句子拉回安全区
  if(!curSent)return;
  const el=curSent,w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=clamp(parseFloat(el.style.left)||0,16,Math.max(16,innerWidth-w-16))+'px';
  el.style.top=clamp(parseFloat(el.style.top)||64,64,Math.max(64,innerHeight-h-40))+'px';
});

/* ============ 进度条 ============ */
const mainProg=$('#mainProg'),thinRange=$('#thinRange'),progText=$('#progText');
function updateProgressUI(){
  const t=S.sentences.length,c=Math.min(S.idx,t);
  const v=t?Math.round(c/t*1000):0;
  mainProg.value=v;thinRange.value=v;setFill(mainProg);setFill(thinRange);
  progText.textContent=`${c} / ${t}`;
}
let progT=null;
function saveProgressSoon(){clearTimeout(progT);progT=setTimeout(()=>{
  try{localStorage.setItem('sr_idx',String(S.idx))}catch{}},800)}
function onProgInput(src){
  setFill(src);
  const o=src===mainProg?thinRange:mainProg;
  o.value=src.value;setFill(o);
  const t=S.sentences.length;
  if(t){const tg=Math.round(src.value/1000*(t-1));progText.textContent=`${tg+1} / ${t}`}
}
[mainProg,thinRange].forEach(r=>{
  r.addEventListener('input',()=>onProgInput(r));
  r.addEventListener('change',()=>{
    const t=S.sentences.length;if(!t)return;
    jumpTo(Math.round(r.value/1000*(t-1)));
  });
});

/* ============ 状态显示 ============ */
function updateStatus(){
  $('#stMode').textContent=S.mode==='A'?'累积':S.mode==='B'?'触发':'未选';
  $('#stSent').textContent=`${Math.min(S.idx,S.sentences.length)}/${S.sentences.length}`;
  $('#stSteps').textContent=`${S.steps} 步`;
  let cue='';
  const thr=Math.max(1,Math.round(P.stepThreshold));
  if(S.mode==='A')
    cue=Eng.speaking?'朗读中':(Eng.credits>0?`堆积 ${Eng.credits} 句`:`还差 ${thr-Eng.pending} 步`);
  else if(S.mode==='B')
    cue=Eng.speaking?(Eng.remainB>0?`连读剩 ${Eng.remainB} 句`:'朗读中'):(Eng.armed?'等待步伐':'队列中');
  $('#stCue').textContent=cue;
}
function updateBookStat(){
  $('#bookName').textContent=Book?Book.name:'未选择';
  $('#bookStat').textContent=S.sentences.length
    ?`${S.sentences.length} 句 · ${P.analysisMode==='script'?'剧本':'小说'}模式`:'上传后自动断句';
  document.body.classList.toggle('has-book',!!Book);
}
function updateAll(){updateStatus();updateProgressUI();updateBookStat()}

/* ============ 文本分析切换（随时互换，进度按比例保留） ============ */
 $$('#segAnalyse .seg-btn').forEach(b=>b.addEventListener('click',()=>{

}));

/* ============ 计步器（加速度计 + 权限申请） ============ */
const Ped={on:false,rising:true,base:9.81,lastAt:0,
  async start(){
    if(!('DeviceMotionEvent'in window)){
      toast('此设备不支持运动传感器，可用「模拟一步」体验流程');
    }else{
      if(typeof DeviceMotionEvent.requestPermission==='function'){ // iOS 系需授权
        let r;
        try{r=await DeviceMotionEvent.requestPermission()}
        catch{toast('传感器权限请求失败');return}
        if(r!=='granted'){toast('传感器权限被拒绝');return}
      }
      window.addEventListener('devicemotion',Ped.motion);
    }
    Ped.on=true;Ped.rising=true;Ped.base=9.81;
    $('#btnPed').classList.add('live');
    $('#btnPedTxt').textContent='停止计步';
    toast('计步器已启动，开始行走吧');
  },
  stop(){
    window.removeEventListener('devicemotion',Ped.motion);
    Ped.on=false;
    $('#btnPed').classList.remove('live');
    $('#btnPedTxt').textContent='启动计步';
    toast('计步器已停止');
  },
  motion(e){
    const a=e.accelerationIncludingGravity;
    if(!a||a.x==null||a.y==null||a.z==null)return;
    const m=Math.hypot(a.x,a.y,a.z);
    Ped.base=Ped.base*0.985+m*0.015; // 缓慢自适应基线（重力）
    const dev=Math.abs(m-Ped.base);
    const thr=clamp(1.5/(P.sensitivity||1),0.5,6);
    const now=performance.now();
    if(Ped.rising&&dev>thr&&now-Ped.lastAt>300){Ped.lastAt=now;Ped.rising=false;onStep()}
    else if(dev<thr*0.4)Ped.rising=true; // 波形回落后再允许计步，防一次迈步双计
  }
};
 $('#btnPed').addEventListener('click',()=>Ped.on?Ped.stop():Ped.start());
 $('#btnSim').addEventListener('click',onStep);
