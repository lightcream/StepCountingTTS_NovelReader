<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>踏句 · 步频 TTS 阅读器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#242728;          /* 灰色底色 */
  --panel:#2a2d2e;       /* 暗黑模块色 */
  --well:#1e2122;        /* 凹陷槽 */
  --txt:#ced4d2;
  --dim:#7b8482;
  --green:#39c5bb;       /* 初音绿 */
  --sd:rgba(0,0,0,.55);
  --sl:rgba(255,255,255,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;height:100dvh;
  font-family:'Rajdhani','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none;-webkit-user-select:none;
}
svg{display:block;width:100%;height:100%}

/* ============ 句子舞台 ============ */
#stage{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.sent{
  position:absolute;line-height:1.4;font-weight:600;white-space:normal;
  animation:sentIn .55s cubic-bezier(.2,1.45,.32,1) both;
}
.sent.out{animation:sentOut .34s ease both}
.sent .ch{display:inline-block;white-space:pre;text-shadow:0 2px 12px rgba(0,0,0,.75);animation:chIn .5s ease both}
@keyframes sentIn{0%{opacity:0;transform:scale(.7);filter:blur(14px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes chIn{0%{opacity:0;transform:translateY(.35em)}100%{opacity:1;transform:none}}
@keyframes sentOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06);filter:blur(10px)}}

/* ============ 顶部模块行 ============ */
#hud{position:fixed;top:0;left:0;right:0;z-index:30;padding:12px 12px 0;
  display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.mod{
  pointer-events:auto;background:var(--panel);border-radius:16px;
  box-shadow:7px 7px 14px var(--sd),-5px -5px 12px var(--sl);
  padding:9px 14px 10px;min-height:86px;min-width:150px;
  display:flex;flex-direction:column;justify-content:space-between;
  flex:1 1 150px;
}
.mod .tag{font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:600;white-space:nowrap}
.mod .row{display:flex;align-items:center;gap:10px;flex:1;margin-top:6px}
.brand{flex:0 0 auto;min-width:130px}
.logo{font-family:'Ma Shan Zheng',serif;font-size:27px;color:var(--green);line-height:1}
.bookinfo,.statecol{display:flex;flex-direction:column;gap:2px;min-width:0}
#bookName,#stateTxt{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:24vw}
#bookMeta,#stateSub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stepNum{font-size:30px;font-weight:700;letter-spacing:.03em;min-width:56px;color:var(--txt);font-variant-numeric:tabular-nums}

/* ============ 拟态控件 ============ */
.btn{
  border:none;cursor:pointer;color:var(--dim);background:var(--panel);
  border-radius:12px;padding:9px 13px;font:600 13px 'Rajdhani','Noto Sans SC',sans-serif;
  box-shadow:5px 5px 10px var(--sd),-4px -4px 9px var(--sl);
  transition:box-shadow .18s,color .18s,opacity .3s;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
}
.btn:hover{color:var(--txt)}
.btn:active,.btn.on{box-shadow:inset 4px 4px 8px rgba(0,0,0,.5),inset -3px -3px 7px rgba(255,255,255,.04);color:var(--green)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn.lockedout{opacity:.35;pointer-events:none}
.btn.lockedout svg{width:12px;height:12px}
.btn svg{width:14px;height:14px;flex:none}

.iconbtn{
  width:38px;height:38px;flex:none;border:none;cursor:pointer;color:var(--dim);
  background:var(--panel);border-radius:50%;padding:9px;
  box-shadow:5px 5px 10px var(--sd),-4px -4px 9px var(--sl);
  transition:box-shadow .18s,color .18s;
}
.iconbtn:hover{color:var(--txt)}
.iconbtn:active{box-shadow:inset 4px 4px 8px rgba(0,0,0,.5),inset -3px -3px 7px rgba(255,255,255,.04);color:var(--green)}

.playbtn{
  width:54px;height:54px;flex:none;border:none;cursor:pointer;color:var(--green);
  background:var(--panel);border-radius:50%;padding:16px;
  box-shadow:6px 6px 12px var(--sd),-5px -5px 11px var(--sl);
  transition:box-shadow .18s;
}
.playbtn:active{box-shadow:inset 5px 5px 10px rgba(0,0,0,.55),inset -4px -4px 8px rgba(255,255,255,.04)}

/* 模式按钮各占一半 */
#modeAcc,#modeTrig,#parseNovel,#parseScript{flex:1;min-width:0}

/* ============ 滑块 ============ */
input[type=range]{
  -webkit-appearance:none;appearance:none;background:transparent;
  height:26px;flex:1;min-width:60px;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:8px;border-radius:6px;
  background:linear-gradient(to right,var(--green) var(--p,0%),var(--well) var(--p,0%));
  box-shadow:inset 2px 2px 5px rgba(0,0,0,.55);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-6px;
  background:var(--green);border:3px solid var(--panel);
  box-shadow:2px 2px 6px rgba(0,0,0,.55);
}
input[type=range]::-moz-range-track{
  height:8px;border-radius:6px;
  background:linear-gradient(to right,var(--green) var(--p,0%),var(--well) var(--p,0%));
  box-shadow:inset 2px 2px 5px rgba(0,0,0,.55);
}
input[type=range]::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;background:var(--green);
  border:3px solid var(--panel);box-shadow:2px 2px 6px rgba(0,0,0,.55);
}

/* ============ 数字输入 ============ */
.num{
  width:76px;flex:none;border:none;outline:none;color:var(--txt);
  background:var(--well);border-radius:10px;padding:8px 4px;text-align:center;
  font:600 15px 'Rajdhani',monospace;box-shadow:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 5px rgba(255,255,255,.03);
}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num{-moz-appearance:textfield;appearance:textfield}

/* ============ 底部设置面板 ============ */
#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.03);
  transition:transform .5s cubic-bezier(.4,0,.2,1);
}
body.panel-hidden #panel{transform:translateY(110%)}
.progRow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#progTxt{font:600 13px 'Rajdhani';color:var(--dim);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;max-height:42dvh;overflow-y:auto;padding-bottom:2px}
.param{
  background:var(--panel);border-radius:14px;padding:9px 12px;min-height:86px;
  box-shadow:7px 7px 14px var(--sd),-5px -5px 12px var(--sl);
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  transition:opacity .3s;
}
.param.locked{opacity:.35;pointer-events:none}
.p-head{display:flex;justify-content:space-between;align-items:baseline}
.p-label{font-size:12px;font-weight:600;color:var(--txt)}
.p-unit{font-size:10px;color:var(--dim);letter-spacing:.1em}
.p-row{display:flex;align-items:center;gap:8px}

/* ============ 底栏（细线进度 + 把手） ============ */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:none;transition:opacity .4s}
#miniTrack{height:3px;width:100%;background:rgba(255,255,255,.06)}
#miniFill{height:100%;width:0;background:var(--green);transition:width .3s linear}
#handle{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(9px + env(safe-area-inset-bottom));
  width:66px;height:24px;border:none;cursor:pointer;color:var(--green);
  background:var(--panel);border-radius:13px;padding:6px 20px;pointer-events:auto;
  box-shadow:5px 5px 10px var(--sd),-4px -4px 9px var(--sl);
}
#handle:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.5)}
/* 面板展开且非全屏 → 整个底栏隐藏；面板展开+全屏 → 只留细线 */
body:not(.panel-hidden):not(.fs) #dock{opacity:0}
body:not(.panel-hidden) #handle{opacity:0;pointer-events:none}

/* ============ 提示条 ============ */
#toast{
  position:fixed;top:16px;left:50%;transform:translate(-50%,-14px);opacity:0;z-index:99;
  background:var(--panel);color:var(--txt);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:8px 8px 18px var(--sd),-5px -5px 12px var(--sl);
  transition:opacity .3s,transform .3s;pointer-events:none;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="stage"></div>

<!-- 顶部功能模块行 -->
<header id="hud">
  <div class="mod brand">
    <div class="tag">TAJU · STEP READER</div>
    <div class="row">
      <span class="logo">踏句</span>
      <button class="iconbtn" id="fsBtn" title="全屏"></button>
    </div>
  </div>

  <div class="mod" style="flex:1.4 1 210px">
    <div class="tag">书籍 BOOK</div>
    <div class="row">
      <button class="iconbtn" id="loadBtn" title="载入 txt / epub" style="width:42px;height:42px"></button>
      <div class="bookinfo">
        <div id="bookName">未载入书籍</div>
        <div id="bookMeta">点击左侧按钮选择文件</div>
      </div>
    </div>
  </div>

  <div class="mod" style="flex:1.4 1 210px">
    <div class="tag">播放 PLAYBACK</div>
    <div class="row">
      <button class="playbtn" id="playBtn" title="开始 / 暂停"></button>
      <div class="statecol">
        <div id="stateTxt">待机</div>
        <div id="stateSub">选择播放模式后开始</div>
      </div>
    </div>
  </div>

  <div class="mod">
    <div class="tag">播放模式 · 本次锁定</div>
    <div class="row">
      <button class="btn" id="modeAcc">累积播放</button>
      <button class="btn" id="modeTrig">触发播放</button>
    </div>
  </div>

  <div class="mod">
    <div class="tag">解析 PARSING</div>
    <div class="row">
      <button class="btn" id="parseNovel">小说</button>
      <button class="btn" id="parseScript">剧本</button>
    </div>
  </div>

  <div class="mod">
    <div class="tag">计步 PEDOMETER</div>
    <div class="row">
      <div id="stepNum">0</div>
      <button class="btn sm" id="motionBtn">启用</button>
      <button class="btn sm" id="simBtn">模拟</button>
    </div>
  </div>
</header>

<!-- 底部设置面板 -->
<div id="panel">
  <div class="progRow">
    <input type="range" id="seek" min="1" max="1" step="1" value="1">
    <span id="progTxt">0 / 0</span>
    <button class="iconbtn" id="collapseBtn" title="收起面板" style="width:34px;height:34px;padding:8px"></button>
  </div>
  <div class="params" id="params"></div>
</div>

<!-- 底栏：细线进度条 + 把手 -->
<div id="dock">
  <div id="miniTrack"><div id="miniFill"></div></div>
  <button id="handle" title="展开面板"></button>
</div>

<input type="file" id="fileInput" accept=".txt,.epub" hidden>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const LS=window.localStorage;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ================= 图标 ================= */
const ICON={
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.4v13.2L19 12z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.4" y="5" width="3.8" height="14" rx="1.3"/><rect x="13.8" y="5" width="3.8" height="14" rx="1.3"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 20h16"/></svg>',
  expand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  shrink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>',
  upChevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5l6-6 6 6"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};

/* ================= 全局状态 ================= */
const S={
  sentences:[], idx:0,
  playing:false, speaking:false,
  mode:null,                 // 'acc' | 'trig'，选择后本次会话锁定，刷新重置
  parseMode: LS.getItem('tj_parse')==='script' ? 'script':'novel',
  credits:0, stepAccum:0,    // 累积模式：堆积配额 / 当前累积
  trigArmed:true, trigQueue:0,
  steps:0, talkId:0,
};
const P={};                  // 参数运行时值
let rawText='', bookName='';
let panelHidden=false, simOn=false, simTimer=null, seeking=false;

/* ================= 参数模块（滑块 + 输入 双通道） ================= */
function paintRange(r){
  const min=+r.min,max=+r.max,v=+r.value;
  r.style.setProperty('--p', max>min ? ((v-min)/(max-min)*100)+'%' : '0%');
}
function makeParam(def){
  const el=document.createElement('div');
  el.className='param';
  el.innerHTML=`<div class="p-head"><span class="p-label">${def.label}</span><span class="p-unit">${def.unit||''}</span></div>
  <div class="p-row"><input type="range" min="${def.min}" max="${def.max}" step="${def.rstep}">
  <input class="num" type="number" inputmode="decimal" min="${def.min}" max="${def.max}" step="0.01"></div>`;
  const range=el.querySelector('input[type=range]'), num=el.querySelector('.num');
  let v=parseFloat(LS.getItem('tj_'+def.key));
  if(!isFinite(v)) v=def.def;
  v=clamp(Math.round(v*100)/100, def.min, def.max);
  P[def.key]=v;

  const render=()=>{ range.value=v; num.value=v.toFixed(2); paintRange(range); };
  const commit=nv=>{
    if(!isFinite(nv)) nv=v;
    v=clamp(Math.round(nv*100)/100, def.min, def.max);
    P[def.key]=v; render();
    LS.setItem('tj_'+def.key, v.toFixed(2));
    if(def.onChange) def.onChange(v);
  };
  range.addEventListener('input',()=>commit(parseFloat(range.value)));
  num.addEventListener('change',()=>commit(parseFloat(num.value)));
  num.addEventListener('blur',()=>{ num.value=v.toFixed(2); });
  render();
  return { el, get:()=>v, set:commit, lock:l=>el.classList.toggle('locked',l) };
}
let pThreshold,pPerTrigger,pSizeMin,pSizeMax;
function buildParams(){
  pThreshold = makeParam({key:'threshold',label:'累积步数阈值',min:5,max:200,rstep:1,def:20,unit:'STEP / 句',onChange:updateHUD});
  pPerTrigger= makeParam({key:'perTrigger',label:'触发朗读句数 X',min:1,max:30,rstep:1,def:1,unit:'句 / 次',onChange:updateHUD});
  pSizeMin   = makeParam({key:'sizeMin',label:'随机字号下限',min:12,max:180,rstep:1,def:26,unit:'PX',onChange:v=>{ if(v>pSizeMax.get()) pSizeMax.set(v); }});
  pSizeMax   = makeParam({key:'sizeMax',label:'随机字号上限',min:12,max:220,rstep:1,def:64,unit:'PX',onChange:v=>{ if(v<pSizeMin.get()) pSizeMin.set(v); }});
  makeParam({key:'rate',label:'朗读语速',min:0.5,max:2,rstep:0.05,def:1,unit:'X / 下一句生效'});
  makeParam({key:'volume',label:'朗读音量',min:0,max:1,rstep:0.05,def:1,unit:'VOL / 下一句生效'});
  [pThreshold,pPerTrigger,pSizeMin,pSizeMax].forEach(p=>$('#params').appendChild(p.el));
  // 语速 / 音量模块也在（makeParam 已按顺序 append，这里调整顺序无必要）
}

/* ================= IndexedDB（书籍正文持久化） ================= */
function idbOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open('taju',1);
  r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
  r.onsuccess=e=>res(e.target.result);
  r.onerror=()=>rej(r.error);
});}
async function idbSet(k,v){const d=await idbOpen();return new Promise((res,rej)=>{
  const t=d.transaction('kv','readwrite');
  t.objectStore('kv').put(v,k);
  t.oncomplete=res; t.onerror=()=>rej(t.error);
});}
async function idbGet(k){const d=await idbOpen();return new Promise((res,rej)=>{
  const q=d.transaction('kv','readonly').objectStore('kv').get(k);
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
});}

/* ================= 文本解析（小说 / 剧本，引号配对保护） ================= */
const OPEN_Q={'“':'”','‘':'’','「':'」','『':'』','"':'"'};
const CLOSE_Q={'”':1,'’':1,'」':1,'』':1,'"':1};
const END_P=/[。！？!?…]/;

function pushChunks(t,start,out){                 // 超长句保护性软切
  if(t.length<=150){ if(t.trim()) out.push({text:t.trim(),start}); return; }
  let buf='',st=start;
  for(const ch of t){
    buf+=ch;
    if((/[，,、；;：:]/.test(ch)&&buf.length>=50)||buf.length>=150){
      if(buf.trim()) out.push({text:buf.trim(),start:st});
      st+=buf.length; buf='';
    }
  }
  if(buf.trim()) out.push({text:buf.trim(),start:st});
}

function splitSentences(t){
  const out=[]; let stack=[],start=0,seen=false;
  const push=(s,e)=>pushChunks(t.slice(s,e),s,out);
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(OPEN_Q[ch]) stack.push(OPEN_Q[ch]);
    else if(CLOSE_Q[ch]) stack.pop();

    if(ch==='\n'&&t[i-1]==='\n'&&stack.length===0){     // 空行（章节边界）强制断句
      if(t.slice(start,i).trim()) push(start,i);
      start=i; stack=[]; seen=false; continue;
    }
    if(END_P.test(ch)){                                  // 句末标点
      seen=true;
      if(stack.length===0){                              // 引号已全部闭合 → 在此断句
        let j=i+1;
        while(j<t.length&&(END_P.test(t[j])||CLOSE_Q[t[j]])) j++;  // 连标点 / 紧随闭引号一并带上
        push(start,j); start=j; stack=[]; seen=false;
      }
    }else if(CLOSE_Q[ch]&&stack.length===0&&seen){       // 闭引号包住了句末标点 → 在引号处断
      push(start,i+1); start=i+1; seen=false;
    }
  }
  if(t.slice(start).trim()) push(start,t.length);
  return out;
}

function stripScript(t){                                // 剧本模式：剥离「人物：」前缀
  const m=t.match(/^([^\n“”"‘’「」『』。！？；;，,]{1,12})[：:]/);
  if(m && /^[“"「『]/.test(t.slice(m[0].length).ltrim?t.slice(m[0].length).ltrim:t.slice(m[0].length).replace(/^\s+/,''))){
    return t.slice(m[0].length).replace(/^\s+/,'');
  }
  return t;
}

function buildSentences(){
  const list=rawText? splitSentences(rawText):[];
  S.sentences=list.map(o=>({
    start:o.start, text:o.text,
    say: S.parseMode==='script' ? (stripScript(o.text)||o.text) : o.text
  }));
  S.idx=clamp(S.idx,0,Math.max(0,list.length-1));
  $('#bookName').textContent=bookName||'未载入书籍';
  $('#bookMeta').textContent=list.length? `${list.length} 句 · ${rawText.length} 字`:'点击左侧按钮选择 txt / epub';
  $('#seek').max=Math.max(1,list.length);
}

/* ================= 句子随机浮现 ================= */
const FONTS=[
  "'Ma Shan Zheng','Noto Sans SC',serif",
  "'ZCOOL XiaoWei','Noto Serif SC',serif",
  "'ZCOOL KuaiLe','Noto Sans SC',sans-serif",
  "'Noto Serif SC',serif",
  "'Noto Sans SC',sans-serif"
];
function randColor(){
  const h=(Math.random()*360)|0, s=60+Math.random()*32, l=58+Math.random()*20;
  return `hsl(${h} ${s}% ${l}%)`;
}
function bounds(){
  const top=$('#hud').getBoundingClientRect().bottom+10;
  let bottom=innerHeight-16;
  if(!panelHidden) bottom-=$('#panel').getBoundingClientRect().height+8;
  return {top, bottom:Math.max(top+80,bottom)};
}
let curEl=null;
function hideSentenceNow(){ if(curEl){curEl.remove();curEl=null;} }
function hideSentence(){ if(!curEl)return; const el=curEl; curEl=null; el.classList.add('out'); setTimeout(()=>el.remove(),380); }

function showSentence(text){
  hideSentenceNow();
  const el=document.createElement('div'); el.className='sent';
  const a=Math.min(P.sizeMin,P.sizeMax), b=Math.max(P.sizeMin,P.sizeMax);
  el.style.fontSize=(a+Math.random()*(b-a)).toFixed(2)+'px';
  const frag=document.createDocumentFragment();
  for(const ch of (text||'').replace(/\s+/g,' ').trim()){
    const sp=document.createElement('span'); sp.className='ch'; sp.textContent=ch;
    sp.style.color=randColor();
    sp.style.fontFamily=FONTS[(Math.random()*FONTS.length)|0];
    sp.style.animationDelay=(Math.random()*0.28).toFixed(2)+'s';
    frag.appendChild(sp);
  }
  el.appendChild(frag);
  $('#stage').appendChild(el);

  const bd=bounds(), pad=14;
  let w=el.offsetWidth*1.06, h=el.offsetHeight;                 // 余量防字体异步加载变宽
  if(w>innerWidth-pad*2){ el.style.maxWidth=(innerWidth-pad*2)+'px'; w=el.offsetWidth; }
  const xMax=Math.max(pad, innerWidth-w-pad);
  el.style.left=(pad+Math.random()*(xMax-pad)).toFixed(1)+'px';
  const yMin=bd.top, yMax=Math.max(yMin, bd.bottom-h-pad);
  el.style.top=(yMin+Math.random()*(yMax-yMin)).toFixed(1)+'px';
  curEl=el;
}

/* ================= TTS ================= */
let zhVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices()||[];
  zhVoice=vs.find(v=>/^zh[-_]CN/i.test(v.lang)&&v.localService)
        ||vs.find(v=>/^zh/i.test(v.lang))
        ||vs.find(v=>/中文|Chinese/i.test(v.name))||null;
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }

function chunk(t,n){const r=[];for(let i=0;i<t.length;i+=n)r.push(t.slice(i,i+n));return r;}

function speakSegments(text,onDone,tid){
  const segs=chunk(text.replace(/\s+/g,' ').trim(),80);
  let i=0,done=false,wd=null;
  const finish=()=>{
    if(done||tid!==S.talkId)return;
    done=true; clearTimeout(wd);
    try{speechSynthesis.cancel();}catch(e){}
    onDone();
  };
  const next=()=>{
    if(done||tid!==S.talkId)return;
    if(i>=segs.length){finish();return;}
    const u=new SpeechSynthesisUtterance(segs[i++]);
    u.lang='zh-CN'; u.rate=clamp(P.rate,0.5,2); u.volume=clamp(P.volume,0,1);
    if(zhVoice){try{u.voice=zhVoice;}catch(e){}}
    u.onend=next;
    u.onerror=ev=>{ if(ev.error==='canceled'||ev.error==='interrupted')return; next(); };
    speechSynthesis.speak(u);
    clearTimeout(wd);
    wd=setTimeout(finish, segs.slice(i-1).join('').length*900/P.rate+3500);  // 看门狗兜底
  };
  next();
}
function cancelSpeech(){ S.talkId++; S.speaking=false; try{speechSynthesis.cancel();}catch(e){} }

/* ================= 播放核心 ================= */
function playCurrent(){
  if(S.speaking)return;
  if(S.idx>=S.sentences.length){ finishBook(); return; }
  S.speaking=true;
  const tid=S.talkId;
  showSentence(S.sentences[S.idx].say);
  speakSegments(S.sentences[S.idx].say, ()=>{ if(tid!==S.talkId)return; sentenceDone(tid); }, tid);
  updateHUD();
}
function sentenceDone(tid){
  S.speaking=false;
  hideSentence();
  S.idx++; saveProgress(); updateHUD();
  setTimeout(()=>{
    if(tid!==S.talkId||!S.playing)return;
    if(S.idx>=S.sentences.length){ finishBook(); return; }
    if(S.mode==='trig'){
      if(S.trigQueue>1){ S.trigQueue--; playCurrent(); }
      else { S.trigQueue=0; S.trigArmed=true; updateHUD(); }
    }else{
      if(S.credits>0){ S.credits--; playCurrent(); }        // 消费堆积的句子配额
    }
  },400);                                                    // 等退出动画播完
}
function finishBook(){
  S.playing=false; S.trigQueue=0; S.trigArmed=true;
  hideSentence(); saveProgress(); updateHUD(); toast('本书已读完');
}
function start(){
  if(!S.mode){ toast('请先在「播放模式」中选择一种方式'); return; }
  if(!S.sentences.length){ toast('请先载入一本 txt 或 epub 书籍'); return; }
  if(S.idx>=S.sentences.length) S.idx=0;
  S.playing=true;
  if(S.mode==='acc'&&S.credits>0){ S.credits--; playCurrent(); }
  updateHUD();
}
function pause(){
  S.playing=false; cancelSpeech(); hideSentence();
  S.trigQueue=0; S.trigArmed=true;
  saveProgress(); updateHUD();
}

/* ================= 步数输入 ================= */
function addSteps(n){
  S.steps+=n;
  if(S.playing&&S.mode){
    if(S.mode==='acc'){
      S.stepAccum+=n;
      while(S.stepAccum>=P.threshold-1e-9){ S.stepAccum-=P.threshold; S.credits++; }
      if(!S.speaking&&S.credits>0){ S.credits--; playCurrent(); }
    }else{
      if(!S.speaking&&S.trigArmed){
        S.trigArmed=false;
        S.trigQueue=Math.max(1,Math.round(P.perTrigger));
        playCurrent();
      }
    }
  }
  updateHUD();
}

/* 计步：设备运动传感器峰值检测 */
let motionOn=false,lpa=0,peakArmed=true,lastStepAt=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null)return;
  const mag=Math.hypot(a.x||0,a.y||0,a.z||0);
  lpa=lpa*0.88+mag*0.12;
  const d=mag-lpa, now=performance.now();
  if(peakArmed&&d>1.5&&now-lastStepAt>270){ peakArmed=false; lastStepAt=now; addSteps(1); }
  else if(d<0.4) peakArmed=true;
}
 $('#motionBtn').addEventListener('click',async()=>{
  if(motionOn){
    window.removeEventListener('devicemotion',onMotion);
    motionOn=false; $('#motionBtn').classList.remove('on'); $('#motionBtn').textContent='启用';
    toast('计步已关闭'); return;
  }
  try{
    if(!window.DeviceMotionEvent){ toast('此设备不支持运动传感器'); return; }
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){ toast('未获得运动传感器权限'); return; }
    }
    window.addEventListener('devicemotion',onMotion);
    motionOn=true; $('#motionBtn').classList.add('on'); $('#motionBtn').textContent='关闭';
    toast('计步已启用，走动即可积累步数');
  }catch(err){ toast('传感器不可用'); }
});
 $('#simBtn').addEventListener('click',()=>{                 // 桌面调试：模拟步行
  simOn=!simOn;
  $('#simBtn').classList.toggle('on',simOn);
  if(simOn){ simTimer=setInterval(()=>addSteps(1),340); toast('模拟步行已开启（约每 0.34 秒一步）'); }
  else{ clearInterval(simTimer); toast('模拟步行已关闭'); }
});

/* ================= 进度条 ================= */
const seekEl=$('#seek');
paintRange(seekEl);
seekEl.addEventListener('pointerdown',()=>seeking=true);
seekEl.addEventListener('input',()=>{
  paintRange(seekEl);
  $('#progTxt').textContent=`${seekEl.value} / ${S.sentences.length}`;
});
function endSeek(){
  if(!seeking)return; seeking=false;
  doSeek(parseInt(seekEl.value)||1);
}
seekEl.addEventListener('pointerup',endSeek);
seekEl.addEventListener('change',endSeek);
function doSeek(v){
  if(!S.sentences.length)return;
  cancelSpeech(); hideSentenceNow();
  S.idx=clamp(v-1,0,S.sentences.length-1);
  saveProgress();
  if(S.playing){
    if(S.mode==='acc'){ if(S.credits>0){ S.credits--; playCurrent(); } }
    else{ S.trigArmed=true; S.trigQueue=0; }
  }
  updateHUD();
}

/* ================= 模式 / 解析切换 ================= */
function applyModeUI(){
  $('#modeAcc').classList.toggle('on',S.mode==='acc');
  $('#modeTrig').classList.toggle('on',S.mode==='trig');
  if(S.mode){
    const other=S.mode==='acc'?$('#modeTrig'):$('#modeAcc');
    other.classList.add('lockedout');
    if(!other.dataset.locked){ other.insertAdjacentHTML('beforeend',ICON.lock); other.dataset.locked='1'; }
    pThreshold.lock(S.mode==='trig');
    pPerTrigger.lock(S.mode==='acc');
  }
}
function chooseMode(m){
  if(S.mode){ toast('播放模式本次已锁定，刷新页面可重新选择'); return; }
  S.mode=m; applyModeUI();
  toast(m==='acc'?'已选择：步数累积播放（每满阈值步数读一句）':'已选择：步数触发播放（每次触发连读 X 句）');
  updateHUD();
}
 $('#modeAcc').addEventListener('click',()=>chooseMode('acc'));
 $('#modeTrig').addEventListener('click',()=>chooseMode('trig'));

function setParseMode(m){
  if(S.parseMode===m)return;
  S.parseMode=m; LS.setItem('tj_parse',m);
  $('#parseNovel').classList.toggle('on',m==='novel');
  $('#parseScript').classList.toggle('on',m==='script');
  if(!rawText){ toast(m==='novel'?'已切换为小说解析':'已切换为剧本解析'); return; }
  const anchor=S.sentences[S.idx]? S.sentences[S.idx].start:0;
  buildSentences();
  let i=0; while(i<S.sentences.length&&S.sentences[i].start<=anchor)i++;
  S.idx=Math.max(0,i-1);
  cancelSpeech(); hideSentenceNow();
  if(S.playing){
    if(S.mode==='acc'){ if(S.credits>0){ S.credits--; playCurrent(); } }
    else{ S.trigArmed=true; S.trigQueue=0; }
  }
  toast(m==='novel'?'已切换为小说解析':'已切换为剧本解析');
  updateHUD();
}
 $('#parseNovel').addEventListener('click',()=>setParseMode('novel'));
 $('#parseScript').addEventListener('click',()=>setParseMode('script'));

/* ================= 面板开合 / 全屏 / 底栏 ================= */
function setPanel(hidden){
  panelHidden=hidden;
  document.body.classList.toggle('panel-hidden',hidden);
  LS.setItem('tj_panelHidden',hidden?'1':'0');
}
 $('#collapseBtn').addEventListener('click',()=>setPanel(true));
 $('#handle').addEventListener('click',()=>setPanel(false));
 $('#fsBtn').addEventListener('click',()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>toast('无法进入全屏'));
});
document.addEventListener('fullscreenchange',()=>{
  const fs=!!document.fullscreenElement;
  document.body.classList.toggle('fs',fs);
  $('#fsBtn').innerHTML=fs?ICON.shrink:ICON.expand;
});

/* ================= HUD 刷新 ================= */
function updateHUD(){
  const total=S.sentences.length;
  let st='待机',sub='';
  if(!total){ st='待机'; sub='先在「书籍」中载入一本 txt / epub'; }
  else if(S.playing&&S.speaking){
    st='朗读中';
    if(S.mode==='trig') sub=`本组剩余 ${S.trigQueue} 句`;
    else sub=S.credits>0?`已堆积 ${S.credits} 句`:'读完等待下一步数';
  }
  else if(S.playing&&S.mode==='acc'){
    st='等待步数';
    sub=`累积 ${S.stepAccum.toFixed(2)} / ${P.threshold.toFixed(2)} 步`+(S.credits>0?` · 堆积 ${S.credits} 句`:'');
    if(!motionOn&&!simOn) sub+=' · 计步未启用';
  }
  else if(S.playing&&S.mode==='trig'){
    st='等待步数';
    sub=(S.trigArmed?'下一步数上涨将连读 ':'准备中 ')+Math.max(1,Math.round(P.perTrigger))+' 句';
    if(!motionOn&&!simOn) sub+=' · 计步未启用';
  }
  else{
    st='已暂停';
    sub=!S.mode?'请选择播放模式':(S.mode==='acc'?'继续后按步数累积播放':'继续后按步数触发播放');
  }
  $('#stateTxt').textContent=st; $('#stateSub').textContent=sub;
  $('#stepNum').textContent=S.steps;

  const idx=clamp(S.idx,0,Math.max(0,total-1));
  $('#progTxt').textContent=total?`${idx+1} / ${total}`:'0 / 0';
  if(!seeking){ seekEl.max=Math.max(1,total); seekEl.value=total?idx+1:1; paintRange(seekEl); }
  $('#miniFill').style.width=total>1?(idx/(total-1)*100)+'%':(total?'100%':'0%');
  $('#playBtn').innerHTML=S.playing?ICON.pause:ICON.play;
}

/* ================= 文件载入 ================= */
async function readTextFile(f){
  const buf=await f.arrayBuffer();
  let txt=new TextDecoder('utf-8').decode(buf);
  if((txt.match(/\uFFFD/g)||[]).length>txt.length*0.01){     // UTF-8 乱码 → 尝试 GBK
    try{ txt=new TextDecoder('gbk').decode(buf); }catch(e){}
  }
  return txt.replace(/^\uFEFF/,'');
}
function zipPath(base,rel){
  try{ return decodeURIComponent(new URL(rel,'http://x/'+(base||'')).pathname.replace(/^\//,'')); }
  catch(e){ return rel; }
}
async function readEpub(f){
  const zip=await JSZip.loadAsync(f);
  const opfName=Object.keys(zip.files).find(n=>/\.opf$/i.test(n));
  if(!opfName) throw 'EPUB 缺少 OPF 结构';
  const doc=new DOMParser().parseFromString(await zip.file(opfName).async('string'),'application/xml');
  const base=opfName.replace(/[^/]*$/,'');
  const manifest={};
  doc.querySelectorAll('manifest > item').forEach(it=>{
    manifest[it.getAttribute('id')]={href:it.getAttribute('href'),type:it.getAttribute('media-type')||''};
  });
  const order=[...doc.querySelectorAll('spine > itemref')]
    .map(r=>r.getAttribute('idref')).filter(id=>manifest[id]);
  let parts=[];
  for(const id of order){
    const item=manifest[id];
    if(item.type&&!/xhtml|html/i.test(item.type))continue;
    const path=zipPath(base,item.href);
    const zf=zip.file(path)||zip.file(path.replace(/^\//,''))
      ||zip.file(Object.keys(zip.files).find(n=>n.endsWith('/'+item.href.split('/').pop()))||'');
    if(!zf)continue;
    const d=new DOMParser().parseFromString(await zf.async('string'),'text/html');
    if(!d.body)continue;
    d.querySelectorAll('script,style,head,nav').forEach(e=>e.remove());
    d.body.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,blockquote,tr,br')
      .forEach(el=>el.insertAdjacentText('afterend','\n'));
    parts.push((d.body.textContent||'').replace(/[ \t\u3000]+\n/g,'\n'));
  }
  return parts.join('\n');
}
 $('#loadBtn').addEventListener('click',()=>$('#fileInput').click());
 $('#fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  $('#loadBtn').classList.add('on');
  try{
    let text=/\.epub$/i.test(f.name)? await readEpub(f): await readTextFile(f);
    if(!text||!text.trim()) throw '未解析到文本内容';
    text=text.replace(/\r/g,'');
    rawText=text; bookName=f.name.replace(/\.(txt|epub)$/i,'');
    S.idx=0; S.credits=0; S.stepAccum=0;
    cancelSpeech(); hideSentenceNow();
    buildSentences();
    await idbSet('book',{name:f.name,text}).catch(()=>{});
    toast(`已载入《${bookName}》· 共 ${S.sentences.length} 句`);
    saveProgress();
  }catch(err){ toast('载入失败：'+(err.message||err)); }
  $('#loadBtn').classList.remove('on');
  $('#loadBtn').classList.remove('busy');
  e.target.value='';
  updateHUD();
});

/* ================= 持久化 / 提示 / 初始化 ================= */
function saveProgress(){
  if(bookName) LS.setItem('tj_prog',JSON.stringify({name:bookName,idx:S.idx}));
}
let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
 $('#playBtn').addEventListener('click',()=>{ S.playing?pause():start(); });

  buildParams();
  $('#playBtn').innerHTML=ICON.play;
  $('#loadBtn').innerHTML=ICON.upload;
  $('#fsBtn').innerHTML=ICON.expand;
  $('#collapseBtn').innerHTML=ICON.down;
  $('#handle').innerHTML=ICON.upChevron;
  $('#parseNovel').classList.toggle('on',S.parseMode==='novel');
  $('#parseScript').classList.toggle('on',S.parseMode==='script');
  if(LS.getItem('tj_panelHidden')==='1') setPanel(true);

  try{
    const book=await idbGet('book');
    const prog=JSON.parse(LS.getItem('tj_prog')||'null');
    if(book&&book.text){
      rawText=book.text;
      bookName=book.name.replace(/\.(txt|epub)$/i,'');
      if(prog&&prog.name===book.name) S.idx=clamp(prog.idx|0,0,1e9);
      buildSentences();
    }
  }catch(e){}
  updateHUD();
})();
