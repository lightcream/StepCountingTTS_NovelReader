<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>计步阅读器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --theme-bg: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #4CAF50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background-color: var(--theme-bg); 
            color: var(--text-color); 
            font-family: sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw;
        }

        /* 句子展示区 */
        #display-area {
            position: relative;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让点击穿透到底部面板 */
        }
        #sentence-container {
            position: absolute;
            display: none; /* 初始隐藏 */
            white-space: nowrap;
            /* 绝对不要加 transition */
        }
        #sentence-container span {
            display: inline-block;
            vertical-align: middle;
        }

        /* 细线进度条 (收起面板时显示) */
        #thin-progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #333;
            z-index: 100;
        }
        #thin-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
        }

        /* 设置面板 */
        #settings-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--panel-bg);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }
        #settings-panel.hidden {
            transform: translateY(100%);
        }
        
        /* 面板开关按钮 */
        #toggle-panel-btn {
            position: absolute;
            top: -40px;
            right: 20px;
            background: var(--panel-bg);
            color: var(--text-color);
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }
        .control-group label { flex-shrink: 0; width: 70px;}
        input[type="range"] { flex-grow: 1; margin: 0 10px; }
        input[type="number"] {
            width: 60px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px;
            text-align: center;
        }
        input[type="file"] { max-width: 200px; font-size: 12px; }
        
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        /* 顶部统计 */
        #stats-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 14px;
            color: #888;
            z-index: 50;
        }
        
        /* 进度数字动画区 */
        #progress-text-container {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="stats-bar">
        步数: <span id="step-count">0</span> | 待读: <span id="queue-count">0</span>句
    </div>

    <div id="display-area">
        <div id="sentence-container"></div>
    </div>

    <div id="thin-progress-bar">
        <div id="thin-progress-fill"></div>
    </div>

    <div id="settings-panel">
        <button id="toggle-panel-btn">隐藏面板</button>
        
        <div id="progress-text-container">阅读进度: <span id="progress-percent">0.00</span>%</div>

        <div class="control-group">
            <label>上传书籍:</label>
            <input type="file" id="file-input" accept=".txt,.epub">
        </div>

        <div class="control-group">
            <label>主进度:</label>
            <input type="range" id="main-progress" min="0" max="100" step="0.01" value="0">
        </div>

        <div class="control-group">
            <label>语速:</label>
            <input type="range" id="rate-slider" min="0.1" max="3.0" step="0.1" value="1.0">
            <input type="number" id="rate-input" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>音量:</label>
            <input type="range" id="volume-slider" min="0.0" max="1.0" step="0.1" value="1.0">
            <input type="number" id="volume-input" min="0.0" max="1.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>最小字号:</label>
            <input type="number" id="min-font-size" value="16">
            <label style="margin-left:10px; width: auto;">最大字号:</label>
            <input type="number" id="max-font-size" value="48">
        </div>

        <button class="btn" id="start-btn">申请传感器权限并启动</button>
        <button class="btn" id="sim-btn" style="background:#555;">(测试) 模拟走100步</button>
    </div>

    <script>
        // --- 全局状态 ---
        let sentences = [];
        let currentIndex = 0;
        let steps = 0;
        let pendingSentences = 0;
        let isSpeaking = false;
        let currentUtterance = null; // 防止GC回收导致onend不触发
        let lastAccel = 0;
        let lastStepTime = 0;
        let displayPercent = 0; // 用于数字动画

        // 可用字体库 (常见中英文字体)
        const fontFamilies = ['Arial', 'Courier New', 'Georgia', 'Times New Roman', 'Verdana', 'SimSun', 'SimHei', 'Microsoft YaHei', 'KaiTi', 'FangSong', 'LiSu'];

        // --- DOM 元素 ---
        const ui = {
            panel: document.getElementById('settings-panel'),
            toggleBtn: document.getElementById('toggle-panel-btn'),
            fileInput: document.getElementById('file-input'),
            mainProgress: document.getElementById('main-progress'),
            progressPercent: document.getElementById('progress-percent'),
            thinProgressFill: document.getElementById('thin-progress-fill'),
            rateSlider: document.getElementById('rate-slider'),
            rateInput: document.getElementById('rate-input'),
            volumeSlider: document.getElementById('volume-slider'),
            volumeInput: document.getElementById('volume-input'),
            minFont: document.getElementById('min-font-size'),
            maxFont: document.getElementById('max-font-size'),
            startBtn: document.getElementById('start-btn'),
            simBtn: document.getElementById('sim-btn'),
            sentenceContainer: document.getElementById('sentence-container'),
            stepCount: document.getElementById('step-count'),
            queueCount: document.getElementById('queue-count')
        };

        // --- 初始化绑定 ---
        ui.toggleBtn.addEventListener('click', () => {
            ui.panel.classList.toggle('hidden');
            ui.toggleBtn.innerText = ui.panel.classList.contains('hidden') ? '展开面板' : '隐藏面板';
        });

        // 联动输入框和滑块
        function syncInputs(slider, input) {
            slider.addEventListener('input', () => input.value = slider.value);
            input.addEventListener('input', () => {
                let val = parseFloat(input.value);
                if (val >= parseFloat(slider.min) && val <= parseFloat(slider.max)) slider.value = val;
            });
        }
        syncInputs(ui.rateSlider, ui.rateInput);
        syncInputs(ui.volumeSlider, ui.volumeInput);

        // --- 文件解析模块 (TXT & EPUB) ---
        ui.fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            let text = '';
            
            if (file.name.endsWith('.txt')) {
                text = await file.text();
            } else if (file.name.endsWith('.epub')) {
                text = await extractEpubText(file);
            } else {
                alert("仅支持 txt 和 epub 格式！");
                return;
            }

            // 清理空格并按标点切分句子
            text = text.replace(/\s+/g, ' ');
            sentences = text.match(/[^。！？.!?]+[。！？.!?]*/g) || [];
            if(sentences.length === 0) sentences = [text]; // 若无标点容错
            
            currentIndex = 0;
            updateProgressUI(true);
            alert(`书籍加载成功！共 ${sentences.length} 句。`);
        });

        async function extractEpubText(file) {
            const zip = await JSZip.loadAsync(file);
            let fullText = "";
            try {
                // 读取 container.xml 寻找 opf
                const containerXml = await zip.file("META-INF/container.xml").async("string");
                const opfPathMatch = containerXml.match(/full-path="([^"]+)"/);
                if (!opfPathMatch) throw new Error("无效的 EPUB 结构");
                
                const opfPath = opfPathMatch[1];
                const basePath = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';
                const opfXml = await zip.file(opfPath).async("string");

                // 提取 manifest
                const manifestRegex = /<item [^>]*id="([^"]+)"[^>]*href="([^"]+)"/gi;
                let manifest = {};
                let match;
                while ((match = manifestRegex.exec(opfXml)) !== null) {
                    manifest[match[1]] = match[2];
                }

                // 提取 spine 并按顺序读取文件
                const spineRegex = /<itemref [^>]*idref="([^"]+)"/gi;
                while ((match = spineRegex.exec(opfXml)) !== null) {
                    const id = match[1];
                    if (manifest[id]) {
                        const filePath = basePath + manifest[id];
                        const fileData = zip.file(decodeURIComponent(filePath)) || zip.file(filePath);
                        if(fileData) {
                             let html = await fileData.async("string");
                             // 粗暴但有效的去标签逻辑
                             html = html.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
                                        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                                        .replace(/<[^>]+>/g, '');
                             fullText += html;
                        }
                    }
                }
            } catch (err) {
                console.error("EPUB 解析出错，尝试回退解析所有 HTML:", err);
                // 失败回退逻辑：直接读取所有 html/xhtml 文件
                for (let filename of Object.keys(zip.files)) {
                    if (filename.endsWith('.html') || filename.endsWith('.xhtml')) {
                        let html = await zip.file(filename).async("string");
                        fullText += html.replace(/<[^>]+>/g, '');
                    }
                }
            }
            return fullText;
        }

        // --- 进度条控制与动画 ---
        ui.mainProgress.addEventListener('input', (e) => {
            if (sentences.length === 0) return;
            const targetPercent = parseFloat(e.target.value);
            currentIndex = Math.floor((targetPercent / 100) * sentences.length);
            // 确保不会越界
            if(currentIndex >= sentences.length) currentIndex = sentences.length - 1;
            
            // 如果正在朗读，强制打断
            if(isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                ui.sentenceContainer.style.display = 'none';
            }
            
            updateProgressUI(false); // 拖动时不需要过度动画，即时反馈
        });

        function updateProgressUI(animate = true) {
            if (sentences.length === 0) return;
            let targetPercent = (currentIndex / sentences.length) * 100;
            ui.mainProgress.value = targetPercent;
            ui.thinProgressFill.style.width = `${targetPercent}%`;
            
            if (animate) {
                animateNumber(targetPercent);
            } else {
                displayPercent = targetPercent;
                ui.progressPercent.innerText = targetPercent.toFixed(2);
            }
        }

        function animateNumber(target) {
            let start = displayPercent;
            let diff = target - start;
            let startTime = performance.now();
            let duration = 500; // 500ms 动画

            function step(time) {
                let elapsed = time - startTime;
                let progress = Math.min(elapsed / duration, 1);
                displayPercent = start + (diff * progress);
                ui.progressPercent.innerText = displayPercent.toFixed(2);
                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }
            requestAnimationFrame(step);
        }

        // --- 计步核心逻辑 ---
        ui.startBtn.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        startPedometer();
                    } else {
                        alert('需要传感器权限才能计步！');
                    }
                } catch (e) {
                    alert('获取权限失败: ' + e);
                }
            } else {
                startPedometer();
            }
            // 顺便唤醒一下 TTS，绕过浏览器限制
            let silentMsg = new SpeechSynthesisUtterance('');
            silentMsg.volume = 0;
            window.speechSynthesis.speak(silentMsg);
            ui.startBtn.innerText = "计步运行中...";
            ui.startBtn.style.background = "#2E7D32";
        });

        ui.simBtn.addEventListener('click', () => {
            steps += 100;
            ui.stepCount.innerText = steps;
            pendingSentences++;
            ui.queueCount.innerText = pendingSentences;
            processQueue();
        });

        function startPedometer() {
            window.addEventListener('devicemotion', (e) => {
                let acc = e.accelerationIncludingGravity;
                if (!acc) return;
                // 计算重力加速度向量的模
                let magnitude = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
                let delta = Math.abs(magnitude - lastAccel);
                
                // 阈值设定，过滤微小抖动
                if (delta > 1.2) {
                    let now = Date.now();
                    if (now - lastStepTime > 300) { // 限制步频上限
                        steps++;
                        ui.stepCount.innerText = steps;
                        lastStepTime = now;
                        
                        if (steps % 100 === 0) {
                            pendingSentences++;
                            ui.queueCount.innerText = pendingSentences;
                            processQueue();
                        }
                    }
                }
                lastAccel = magnitude;
            });
        }

        // --- 朗读与视觉渲染 ---
        function processQueue() {
            if (isSpeaking || pendingSentences <= 0 || sentences.length === 0 || currentIndex >= sentences.length) {
                return;
            }
            
            let sentence = sentences[currentIndex];
            renderRandomSentence(sentence);
            speakSentence(sentence);
        }

        function renderRandomSentence(text) {
            const minS = parseInt(ui.minFont.value) || 16;
            const maxS = parseInt(ui.maxFont.value) || 48;
            
            let html = '';
            for(let char of text) {
                let color = `rgb(${Math.floor(Math.random()*155+100)}, ${Math.floor(Math.random()*155+100)}, ${Math.floor(Math.random()*155+100)})`; // 偏亮色适配暗背景
                let font = fontFamilies[Math.floor(Math.random() * fontFamilies.length)];
                let size = Math.floor(Math.random() * (maxS - minS + 1)) + minS;
                html += `<span style="color:${color}; font-family:'${font}'; font-size:${size}px;">${char}</span>`;
            }
            
            ui.sentenceContainer.innerHTML = html;
            
            // 随机横竖版
            const isVertical = Math.random() > 0.5;
            ui.sentenceContainer.style.writingMode = isVertical ? 'vertical-rl' : 'horizontal-tb';
            
            // 先显示出来，为了获取真实宽高来计算安全边界
            ui.sentenceContainer.style.display = 'block';
            
            const rect = ui.sentenceContainer.getBoundingClientRect();
            const maxX = window.innerWidth - rect.width;
            const maxY = window.innerHeight - rect.height;
            
            // 防溢出随机坐标
            const x = Math.max(0, Math.floor(Math.random() * maxX));
            const y = Math.max(0, Math.floor(Math.random() * maxY));
            
            ui.sentenceContainer.style.left = `${x}px`;
            ui.sentenceContainer.style.top = `${y}px`;
        }

        function speakSentence(text) {
            isSpeaking = true;
            window.speechSynthesis.cancel(); // 清理残留队列
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.rate = parseFloat(ui.rateInput.value) || 1.0;
            currentUtterance.volume = parseFloat(ui.volumeInput.value) || 1.0;
            
            currentUtterance.onend = () => {
                isSpeaking = false;
                ui.sentenceContainer.style.display = 'none'; // 句子念完隐藏
                currentIndex++;
                pendingSentences--;
                ui.queueCount.innerText = pendingSentences;
                
                updateProgressUI(true); // 更新进度和动画
                
                // 处理下一句
                processQueue();
            };

            currentUtterance.onerror = (e) => {
                console.error("TTS 错误:", e);
                isSpeaking = false;
                ui.sentenceContainer.style.display = 'none';
            };

            window.speechSynthesis.speak(currentUtterance);
        }
    </script>
</body>
</html>
