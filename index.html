<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miku Pedometer Reader</title>
    <!-- 引入 JSZip 用于本地纯前端解析 Epub -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #2b2d31; /* 灰色底色 */
            --module-color: #232428; /* 暗黑色模块 */
            --miku-green: #39C5BB;
            --text-color: #e0e0e0;
            --shadow-light: #34373d;
            --shadow-dark: #121315;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* 阅读画布区域 */
        #canvas {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* 句子显示样式 */
        .sentence-display {
            position: absolute;
            white-space: pre-wrap;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s ease, transform 0.5s ease;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .sentence-display.show {
            opacity: 1;
            transform: scale(1);
        }

        /* 底部进度条 */
        #progress-line-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: var(--module-color);
            z-index: 1000;
            cursor: pointer;
        }
        #progress-line {
            height: 100%;
            background-color: var(--miku-green);
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 8px var(--miku-green);
        }

        /* 设置面板区域 */
        #settings-wrapper {
            position: fixed;
            bottom: 6px; /* 在进度条上方 */
            left: 0;
            width: 100%;
            background-color: var(--bg-color);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 999;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
            padding-bottom: 20px;
        }
        #settings-wrapper.open {
            transform: translateY(0);
        }

        /* 隐藏/显示按钮 */
        #toggle-btn {
            position: absolute;
            top: -40px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--miku-green);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            transition: transform 0.3s;
        }

        /* 横向滚动模块容器 */
        .modules-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 20px;
            gap: 20px;
            scrollbar-width: none; /* Firefox */
        }
        .modules-container::-webkit-scrollbar { display: none; } /* Chrome */

        /* 单个模块拟态风 */
        .module {
            flex: 0 0 300px;
            scroll-snap-align: center;
            background-color: var(--module-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow:  8px 8px 16px var(--shadow-dark), 
                        -8px -8px 16px var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 280px; /* 统一高度 */
        }

        .module h3 {
            font-size: 16px;
            color: var(--miku-green);
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* 控件样式 */
        label { font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 4px;
            background: var(--bg-color);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--miku-green);
            margin-top: -4px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 70px;
            padding: 5px;
            border-radius: 8px;
            border: none;
            background: var(--bg-color);
            color: var(--miku-green);
            text-align: center;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            outline: none;
        }

        .pure-btn {
            background-color: var(--miku-green);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .pure-btn:active { opacity: 0.8; }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: var(--bg-color);
            color: var(--miku-green);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            outline: none;
        }

        /* Radio 自定义 */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .radio-label input { display: none; }
        .radio-custom {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            position: relative;
        }
        .radio-label input:checked + .radio-custom::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--miku-green);
        }
        .radio-label input:disabled + .radio-custom { opacity: 0.3; }
        .radio-label input:disabled ~ span { opacity: 0.3; }

        .stat-box {
            background: var(--bg-color);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            color: var(--miku-green);
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="canvas"></div>

    <div id="progress-line-container" onclick="seekProgress(event)">
        <div id="progress-line"></div>
    </div>

    <div id="settings-wrapper" class="open">
        <button id="toggle-btn">▼</button>
        <div class="modules-container">
            
            <!-- 模块1：文件与控制 -->
            <div class="module">
                <h3>文件与控制</h3>
                <div class="file-input-wrapper">
                    <button class="pure-btn" style="width: 100%;">上传书籍 (TXT/EPUB)</button>
                    <input type="file" id="file-input" accept=".txt,.epub">
                </div>
                <div id="file-name" style="font-size: 12px; text-align: center; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">未选择文件</div>
                <button class="pure-btn" id="req-sensor-btn" onclick="requestMotionPermission()">申请计步权限</button>
                <!-- 隐藏的按钮用于PC端调试模拟步数 -->
                <button class="pure-btn" style="background:#555; margin-top: auto;" onclick="simulateStep()">+ 模拟走1步 (PC测试用)</button>
            </div>

            <!-- 模块2：状态监控 -->
            <div class="module">
                <h3>运动与朗读状态</h3>
                <label>累计总步数：</label>
                <div class="stat-box" id="step-counter-display">0</div>
                <label>文本模式切换：</label>
                <select id="text-mode" onchange="saveSettings(); reparseText();">
                    <option value="novel">小说模式 (句号断句)</option>
                    <option value="script">剧本模式 (只读引号内容)</option>
                </select>
                <button class="pure-btn" style="background: #e74c3c; margin-top: auto;" onclick="stopTTS()">停止当前朗读</button>
            </div>

            <!-- 模块3：播放模式选择 -->
            <div class="module">
                <h3>播放模式选择</h3>
                <div class="radio-group" id="play-mode-group">
                    <label class="radio-label">
                        <input type="radio" name="playMode" value="accumulate" onchange="lockPlayMode()">
                        <div class="radio-custom"></div>
                        <span>步数累积播放 (20步/句，可堆积)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="playMode" value="trigger" onchange="lockPlayMode()">
                        <div class="radio-custom"></div>
                        <span>步数触发播放 (步数上涨读X句)</span>
                    </label>
                </div>
                <div style="font-size: 11px; color: #777; margin-top: 5px;">* 选择后将锁定另一模式，刷新网页可重新选择。</div>
            </div>

            <!-- 模块4：UI与参数调整 (1) -->
            <div class="module">
                <h3>参数调整</h3>
                <label>
                    触发播放句数 (X):
                </label>
                <div class="input-group">
                    <input type="range" id="x-sentences-slider" min="1" max="10" step="1">
                    <input type="number" id="x-sentences-input" min="1" max="10" step="1">
                </div>

                <label style="margin-top: 15px;">最小字号 (px):</label>
                <div class="input-group">
                    <input type="range" id="min-font-slider" min="12" max="50" step="0.01">
                    <input type="number" id="min-font-input" step="0.01">
                </div>

                <label style="margin-top: 15px;">最大字号 (px):</label>
                <div class="input-group">
                    <input type="range" id="max-font-slider" min="30" max="120" step="0.01">
                    <input type="number" id="max-font-input" step="0.01">
                </div>
            </div>

        </div>
    </div>

    <script>
        // === 全局变量 ===
        const FONTS = ['Arial', 'Courier New', 'Georgia', 'Times New Roman', 'Verdana', 'Impact', 'Trebuchet MS', 'Comic Sans MS', 'Microsoft YaHei', 'KaiTi', 'SimHei'];
        let fullText = "";
        let sentences = [];
        let currentSentenceIndex = parseInt(localStorage.getItem('miku_read_index')) || 0;
        
        let stepCount = 0;
        let lastAccel = 0;
        let ttsPlaying = false;
        let accumulatedReadChances = 0; // 用于累积模式：剩余可读句数
        let triggerSentencesToRead = 0; // 用于触发模式：当次触发需要读的剩余句数

        // === 默认配置与本地存储 ===
        const defaultSettings = {
            playMode: '',
            textMode: 'novel',
            xSentences: '1.00',
            minFont: '24.00',
            maxFont: '60.00'
        };

        function getSetting(key) {
            return localStorage.getItem('miku_' + key) || defaultSettings[key];
        }

        function setSetting(key, value) {
            localStorage.setItem('miku_' + key, value);
        }

        // === UI 初始化与双向绑定 ===
        function bindInputs(sliderId, inputId, settingKey) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            
            let val = getSetting(settingKey);
            slider.value = val;
            input.value = val;

            const update = (e) => {
                let v = parseFloat(e.target.value).toFixed(2);
                slider.value = v;
                input.value = v;
                setSetting(settingKey, v);
            };

            slider.addEventListener('input', update);
            input.addEventListener('change', update);
        }

        function initUI() {
            bindInputs('x-sentences-slider', 'x-sentences-input', 'xSentences');
            bindInputs('min-font-slider', 'min-font-input', 'minFont');
            bindInputs('max-font-slider', 'max-font-input', 'maxFont');

            document.getElementById('text-mode').value = getSetting('textMode');

            // 恢复文本索引
            if(localStorage.getItem('miku_saved_text')) {
                fullText = localStorage.getItem('miku_saved_text');
                document.getElementById('file-name').innerText = "已加载上次书籍";
                reparseText();
            }

            // 进度条点击支持拖动 (简易版)
            const pl = document.getElementById('progress-line-container');
            let isDragging = false;
            pl.addEventListener('mousedown', () => isDragging = true);
            pl.addEventListener('mousemove', (e) => { if(isDragging) seekProgress(e); });
            pl.addEventListener('mouseup', () => isDragging = false);
            pl.addEventListener('mouseleave', () => isDragging = false);

            pl.addEventListener('touchstart', () => isDragging = true);
            pl.addEventListener('touchmove', (e) => { if(isDragging) seekProgress(e.touches[0]); });
            pl.addEventListener('touchend', () => isDragging = false);
        }

        function saveSettings() {
            setSetting('textMode', document.getElementById('text-mode').value);
        }

        // 面板显示隐藏逻辑
        const wrapper = document.getElementById('settings-wrapper');
        const toggleBtn = document.getElementById('toggle-btn');
        toggleBtn.addEventListener('click', () => {
            if(wrapper.classList.contains('open')) {
                wrapper.classList.remove('open');
                toggleBtn.innerText = '▲';
                toggleBtn.style.transform = "translateY(-10px)";
            } else {
                wrapper.classList.add('open');
                toggleBtn.innerText = '▼';
                toggleBtn.style.transform = "translateY(0)";
            }
        });

        // 锁定播放模式
        function lockPlayMode() {
            const radios = document.getElementsByName('playMode');
            let selected = '';
            radios.forEach(r => {
                if(r.checked) selected = r.value;
                r.disabled = true; // 选择后禁用
            });
            setSetting('playMode', selected);
        }

        // 初始化播放模式状态（刷新网页时重置锁定，但这里遵循题目：选择一个之后另一个在本次打开页面不可选，刷新页面则可以重新选择。所以刷新后不预设选项）
        // 留空让用户每次刷新重新选。

        // === 文本解析 (核心逻辑) ===
        function reparseText() {
            if(!fullText) return;
            const mode = document.getElementById('text-mode').value;
            sentences = [];
            
            let current = "";
            let inQuote = false;
            
            // 遍历字符防止破开引号
            for(let i=0; i<fullText.length; i++) {
                let char = fullText[i];
                current += char;
                
                if(char === '“' || char === '「') inQuote = true;
                if(char === '”' || char === '」') inQuote = false;

                // 遇到句号/感叹号/问号/回车，且不在引号内时，进行断句
                if(!inQuote && /[。！？\?\!\n]/.test(char)) {
                    let t = current.trim();
                    if(t) processAndPushSentence(t, mode);
                    current = "";
                }
            }
            if(current.trim()) processAndPushSentence(current.trim(), mode);
            
            updateProgressVisual();
        }

        function processAndPushSentence(str, mode) {
            let displayStr = str;
            let speakStr = str;

            if(mode === 'script') {
                // 寻找 XX人物：“内容” 格式
                let match = str.match(/^.*?[:：]\s*[“「](.*?)[”」]/);
                if(match) {
                    speakStr = match[1]; // 只念引号内
                } else {
                    // 如果没有匹配到这种格式，作为容错，不发音或者全发音。这里选择全发音。
                }
            } else {
                // 小说模式，去掉不需要发音的特殊符号（这里TTS自带处理，所以不用刻意删）
            }

            if(speakStr.trim().length > 0) {
                sentences.push({ display: displayStr, speak: speakStr });
            }
        }

        // === 文件处理 ===
        document.getElementById('file-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            document.getElementById('file-name').innerText = file.name;
            
            if(file.name.toLowerCase().endsWith('.epub')) {
                // 处理 Epub
                try {
                    const zip = new JSZip();
                    const contents = await zip.loadAsync(file);
                    let textArray = [];
                    // 暴力提取所有 html/xhtml 文本
                    for(let filename in contents.files) {
                        if(filename.endsWith('.html') || filename.endsWith('.xhtml') || filename.endsWith('.htm')) {
                            let htmlData = await contents.files[filename].async("string");
                            // 简单的正则去 HTML 标签
                            let text = htmlData.replace(/<style[^>]*>.*<\/style>/gi, '')
                                               .replace(/<script[^>]*>.*<\/script>/gi, '')
                                               .replace(/<[^>]+>/g, '')
                                               .replace(/&nbsp;/g, ' ');
                            textArray.push(text);
                        }
                    }
                    fullText = textArray.join('\n');
                } catch(err) {
                    alert('解析 Epub 失败，请尝试 TXT 格式');
                }
            } else {
                // 处理 TXT
                fullText = await file.text();
            }

            localStorage.setItem('miku_saved_text', fullText);
            currentSentenceIndex = 0;
            localStorage.setItem('miku_read_index', 0);
            reparseText();
        });


        // === 视觉呈现逻辑 ===
        function getRandomColor() {
            // 在暗色背景下生成亮色
            const letters = '89ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 8)];
            }
            return color;
        }

        function displayRandomSentence(textObj) {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = ''; // 清除上一个

            const div = document.createElement('div');
            div.className = 'sentence-display';
            
            let minS = parseFloat(getSetting('minFont'));
            let maxS = parseFloat(getSetting('maxFont'));
            if(minS > maxS) { let temp = minS; minS = maxS; maxS = temp; }
            let size = Math.random() * (maxS - minS) + minS;
            div.style.fontSize = size + 'px';

            // 每个字随机颜色和字体
            for(let char of textObj.display) {
                let span = document.createElement('span');
                span.textContent = char;
                span.style.color = getRandomColor();
                span.style.fontFamily = FONTS[Math.floor(Math.random() * FONTS.length)];
                div.appendChild(span);
            }

            canvas.appendChild(div);

            // 获取尺寸并计算随机位置（保证不越界）
            const rect = div.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            
            let maxLeft = canvasRect.width - rect.width;
            let maxTop = canvasRect.height - rect.height;
            maxLeft = Math.max(0, maxLeft);
            maxTop = Math.max(0, maxTop);

            div.style.left = (Math.random() * maxLeft) + 'px';
            div.style.top = (Math.random() * maxTop) + 'px';

            // 触发动画
            requestAnimationFrame(() => {
                div.classList.add('show');
            });
        }

        function updateProgressVisual() {
            if(sentences.length === 0) return;
            let pct = (currentSentenceIndex / sentences.length) * 100;
            document.getElementById('progress-line').style.width = pct + '%';
        }

        function seekProgress(e) {
            if(sentences.length === 0) return;
            const container = document.getElementById('progress-line-container');
            const rect = container.getBoundingClientRect();
            let x = e.clientX || (e.touches && e.touches[0].clientX);
            if(x === undefined) return;
            let pct = (x - rect.left) / rect.width;
            pct = Math.max(0, Math.min(1, pct));
            currentSentenceIndex = Math.floor(pct * sentences.length);
            localStorage.setItem('miku_read_index', currentSentenceIndex);
            updateProgressVisual();
            
            // 拖动后如果正在播放，立即打断
            if(ttsPlaying) {
                window.speechSynthesis.cancel();
            }
        }

        // === TTS 与播放逻辑 ===
        function stopTTS() {
            window.speechSynthesis.cancel();
            ttsPlaying = false;
            triggerSentencesToRead = 0;
            accumulatedReadChances = 0;
        }

        function playNextSentence() {
            if(currentSentenceIndex >= sentences.length) {
                ttsPlaying = false;
                return;
            }

            ttsPlaying = true;
            let sentenceObj = sentences[currentSentenceIndex];
            
            displayRandomSentence(sentenceObj);
            updateProgressVisual();

            let utterThis = new SpeechSynthesisUtterance(sentenceObj.speak);
            // 默认调用系统 TTS 引擎
            
            utterThis.onend = function() {
                ttsPlaying = false;
                currentSentenceIndex++;
                localStorage.setItem('miku_read_index', currentSentenceIndex);

                let selectedMode = getPlayMode();
                if(selectedMode === 'accumulate') {
                    if(accumulatedReadChances > 0) {
                        accumulatedReadChances--;
                        playNextSentence();
                    }
                } else if(selectedMode === 'trigger') {
                    if(triggerSentencesToRead > 0) {
                        triggerSentencesToRead--;
                        playNextSentence();
                    }
                }
            };

            utterThis.onerror = function() {
                ttsPlaying = false;
            };

            window.speechSynthesis.speak(utterThis);
        }

        function getPlayMode() {
            let mode = '';
            document.getElementsByName('playMode').forEach(r => {
                if(r.checked) mode = r.value;
            });
            return mode;
        }

        // === 计步器核心逻辑 ===
        function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            alert("已获取传感器权限！");
                        } else {
                            alert("权限被拒绝");
                        }
                    })
                    .catch(console.error);
            } else {
                // 非 iOS 13+ 或直接支持
                window.addEventListener('devicemotion', handleMotion);
                alert("已开启监听！(如果您在PC上，请使用模拟按钮)");
            }
        }

        let lastStepTime = 0;
        function handleMotion(event) {
            let acc = event.accelerationIncludingGravity;
            if(!acc) return;
            
            // 计算加速度向量大小
            let currentAccel = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
            let now = Date.now();
            
            // 简单的峰值检测算法 (过滤重力且需存在明显变动)
            if(Math.abs(currentAccel - lastAccel) > 1.5 && currentAccel > 11.5) {
                // 防抖，限制步频（至少 300ms 一步）
                if(now - lastStepTime > 300) {
                    processStepEvent();
                    lastStepTime = now;
                }
            }
            lastAccel = currentAccel;
        }

        // 暴露模拟函数供按钮调用
        function simulateStep() {
            processStepEvent();
        }

        function processStepEvent() {
            stepCount++;
            document.getElementById('step-counter-display').innerText = stepCount;

            if(sentences.length === 0) return;

            let mode = getPlayMode();
            if(!mode) return; // 未选择模式则不响应

            if(mode === 'accumulate') {
                // 步数累积播放：每20步触发一次机会
                if(stepCount % 20 === 0) {
                    accumulatedReadChances++;
                    if(!ttsPlaying) {
                        accumulatedReadChances--;
                        playNextSentence();
                    } // 如果正在播，则不操作，堆积。
                }
            } else if(mode === 'trigger') {
                // 步数触发播放：步数上涨触发读X句。如果正在读则无视本次步数上涨。
                if(!ttsPlaying) {
                    let x = parseInt(parseFloat(getSetting('xSentences')));
                    triggerSentencesToRead = x - 1; // 减1是因为本次立马播1句
                    playNextSentence();
                }
            }
        }

        // === 启动 ===
        window.onload = () => {
            initUI();
            // 防止 iOS/Android 锁屏断掉TTS，部分系统需要一些保活策略，这里不做过度复杂处理，依靠 Web Speech API 原生行为。
        };

    </script>
</body>
</html>
